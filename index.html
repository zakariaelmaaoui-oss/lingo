<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>طلاقة — تعلّم الفرنسية والألمانية بالعربية</title>
<meta name="description" content="طلاقة: تعلّم الفرنسية والألمانية بالعربية، من A1 حتى B2، بالكلمات والقواعد والاختبارات والامتحانات.">
<meta name="theme-color" content="#6E74F5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B7BFA'/%3E%3Cstop offset='1' stop-color='%238C6CF0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M17 18h30a5 5 0 0 1 5 5v15a5 5 0 0 1-5 5H31l-9 7v-7h-5a5 5 0 0 1-5-5V23a5 5 0 0 1 5-5z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M32 23.5l1.9 4.6 4.6 1.9-4.6 1.9L32 36.5l-1.9-4.6-4.6-1.9 4.6-1.9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: welcome picker -> app shell (bottom tab bar on phones, side rail on desktop); soft white surfaces, one blue→violet gradient reserved for progress and primary actions */
:root{
 color-scheme:light;
 --bg:#FFFFFF;--panel:#F5F6FB;--surface:#FFFFFF;--ink:#151833;--muted:#6C7192;--faint:#A3A8C3;--line:#E8EAF3;
 --blue:#5470F5;--violet:#8C6CF0;--soft:#EEF1FE;--vsoft:#F3EFFE;
 --grad:linear-gradient(120deg,#5B7BFA 0%,#8C6CF0 100%);
 --ok:#1C9C68;--ok-soft:#E5F6EE;--bad:#E04A55;--bad-soft:#FDECEE;--warm:#F59E0B;
 --gm:#2F6BFF;--gf:#E0458B;--gn:#16A066;
 --f:"Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
 --r:20px;--r-sm:14px;
 --shadow:0 1px 2px rgba(21,24,51,.04),0 8px 24px rgba(21,24,51,.06);
 --shadow-lg:0 2px 4px rgba(21,24,51,.04),0 18px 40px rgba(84,112,245,.14);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.fw{direction:ltr;unicode-bidi:isolate;font-weight:700;letter-spacing:-.01em}
.art{font-weight:800}
.g-m{color:var(--gm)}.g-f{color:var(--gf)}.g-n{color:var(--gn)}
mark{background:none;font-weight:700;color:var(--blue)}
mark.g-m{color:var(--gm)}mark.g-f{color:var(--gf)}mark.g-n{color:var(--gn)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.enter{animation:rise .32s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- flags ---------- */
.flag{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(21,24,51,.08)}
.flag.fr{background:linear-gradient(90deg,#2050D6 0 33.4%,#fff 33.4% 66.6%,#E5384A 66.6%)}
.flag.de{background:linear-gradient(180deg,#1B1B1F 0 33.4%,#DD2C2C 33.4% 66.6%,#F5C232 66.6%)}
.flag.sm{width:26px;height:26px}
.flag.lg{width:64px;height:64px}

/* ---------- welcome ---------- */
#welcome{min-height:100%;position:relative;overflow:hidden}
#welcome::before{content:"";position:absolute;inset:-180px -120px auto auto;width:460px;height:460px;border-radius:50%;background:radial-gradient(closest-side,rgba(140,108,240,.16),transparent);pointer-events:none}
#welcome::after{content:"";position:absolute;inset:auto auto -200px -140px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(84,112,245,.12),transparent);pointer-events:none}
.wel{position:relative;max-width:980px;margin:0 auto;padding-block:40px 56px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand .dot{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff}
.brand .dot .ico{width:18px;height:18px}
.wel-hero{display:flex;flex-direction:column;gap:10px;max-width:560px}
.wel-hero h1{font-size:clamp(2rem,6.5vw,3rem);font-weight:700;letter-spacing:-.02em}
.wel-hero p{font-size:1.05rem;color:var(--muted)}
.langs{display:grid;gap:16px}
@media (min-width:720px){.langs{grid-template-columns:1fr 1fr}}
.lang{position:relative;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.lang:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#D6DBF6}
.lang-top{display:flex;align-items:center;gap:14px}
.lang-top h2{font-size:1.5rem;font-weight:700}
.lang-top .fw{display:block;font-size:.95rem;font-weight:500;color:var(--muted)}
.lvl-pill{margin-inline-start:auto;font-size:.78rem;font-weight:700;color:var(--blue);background:var(--soft);padding:4px 10px;border-radius:99px;direction:ltr}
.feat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:.92rem}
.feat li{display:flex;align-items:center;gap:8px;color:#3B4064}
.feat .ico{width:16px;height:16px;color:var(--violet);stroke-width:2.4}
.lang-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.lang-stats{display:flex;flex-wrap:wrap;gap:14px;font-size:.88rem;color:var(--muted)}
.lang-stats b{color:var(--ink);font-weight:700}
.go{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;transition:transform .25s}
.lang:hover .go{transform:translateX(-4px)}
.wel-note{font-size:.85rem;color:var(--faint)}

/* ---------- app shell ---------- */
#app{min-height:100%}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
 padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-brand{display:none}
.nav-items{display:grid;grid-template-columns:repeat(7,1fr);max-width:560px;margin:0 auto}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.72rem;font-weight:600;color:var(--faint);transition:color .2s}
.nav-btn .ico{width:22px;height:22px}
.nav-btn[aria-current="page"]{color:var(--blue)}
.main{max-width:1080px;margin:0 auto;padding-block:14px 110px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.switch{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:600;font-size:.9rem;transition:border-color .2s,box-shadow .2s}
.switch:hover{border-color:#D3D8F4;box-shadow:var(--shadow)}
.switch .ico{width:16px;height:16px;color:var(--muted)}
.pills{margin-inline-start:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--panel);font-weight:700;font-size:.88rem}
.pill.xp{color:var(--violet);background:var(--vsoft);direction:ltr}
.pill.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}
@media (min-width:900px){
 #app{display:grid;grid-template-columns:240px 1fr}
 .nav{position:sticky;top:0;inset:auto;height:100vh;border-top:0;border-inline-end:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:24px;background:var(--bg)}
 .nav-brand{display:flex}
 .nav-items{display:flex;flex-direction:column;gap:4px;max-width:none;margin:0}
 .nav-btn{flex-direction:row;gap:12px;padding:11px 14px;font-size:.95rem;color:var(--muted)}
 .nav-btn:hover{background:var(--panel);color:var(--ink)}
 .nav-btn[aria-current="page"]{background:var(--soft);color:var(--blue)}
 .main{padding-block:28px 64px;padding-left:40px;padding-right:40px;width:100%}
}

/* ---------- shared bits ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h1{font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
.sec{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:22px 0 10px}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r-sm);font-weight:700;border:1px solid var(--line);background:var(--surface);transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{border-color:#D3D8F4;box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(110,100,240,.25)}
.btn.pri:hover{box-shadow:0 10px 26px rgba(110,100,240,.34)}
.btn.ghost{border-color:transparent;background:var(--panel)}
.btn.done,.btn:disabled{cursor:default;background:var(--ok-soft);border-color:transparent;color:var(--ok);box-shadow:none}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btn.block{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .2s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.gtag{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--panel)}
.gtag.g-m{background:#EAF0FF}.gtag.g-f{background:#FDEAF3}.gtag.g-n{background:#E4F6EE}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.legend b{font-weight:800;direction:ltr}
.empty{text-align:center;padding:40px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ico{width:34px;height:34px;color:var(--faint)}

/* ---------- home ---------- */
.home{display:grid;gap:16px}
@media (min-width:900px){.home{grid-template-columns:1.1fr 1fr;align-items:start;gap:24px}.home-l,.home-r{display:flex;flex-direction:column;gap:16px}}
.home-l,.home-r{display:contents}
@media (min-width:900px){.home-l,.home-r{display:flex}}
.hello p{font-size:1rem;font-weight:500}
.hello h1{font-size:clamp(2rem,8vw,2.7rem);font-weight:800;letter-spacing:-.03em;margin-top:4px}
.hello h1 .fw{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.plan{padding:20px;display:flex;flex-direction:column;gap:14px}
.plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.plan-top h2{font-size:1.15rem;font-weight:700}
.plan-top p{margin-top:2px}
.plan-top p b{color:var(--ink);font-size:1.05rem}
.flame{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:8px 12px;border-radius:16px;background:#FFF5E6}
.flame b{font-size:1.25rem}
.flame span{font-size:.72rem;color:#9A6512;font-weight:600}
.plan-msg{font-size:.9rem;color:var(--muted)}
.plan.won{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border-color:transparent}
.plan.won .plan-msg{color:var(--ok);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:start;padding:16px;display:flex;flex-direction:column;gap:14px;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.tile-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.tile-ic .ico{width:22px;height:22px}
.ic-b{background:var(--soft);color:var(--blue)}.ic-v{background:var(--vsoft);color:var(--violet)}.ic-g{background:#E7F6EF;color:var(--gn)}.ic-o{background:#FFF3E2;color:#D9850B}
.tile .arrow{color:var(--faint)}
.tile h3{font-size:1.02rem;font-weight:700}
.tile p{font-size:.84rem;color:var(--muted)}
.cta{width:100%;padding:16px;font-size:1.02rem}
.word-day{padding:18px;display:flex;flex-direction:column;gap:8px}
.word-day .w{font-size:1.6rem}
.word-day .ex{font-size:.92rem}

/* ---------- words ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid transparent;border-radius:var(--r-sm);padding:0 14px;margin-bottom:12px;transition:border-color .2s,background .2s}
.search:focus-within{border-color:#CBD3FA;background:var(--surface)}
.search .ico{color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--panel);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:.86rem;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(21,24,51,.1)}
.study{display:grid;gap:14px;margin-top:16px;max-width:620px}
.fcard{position:relative;width:100%;min-height:300px;padding:30px 20px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:box-shadow .25s,transform .25s}
.fcard:hover{box-shadow:var(--shadow-lg)}
.fcard.flip{animation:flip .35s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.fcard .tl{position:absolute;top:14px;inset-inline-start:16px;display:flex;gap:6px;align-items:center}
.fcard .tr{position:absolute;top:14px;inset-inline-end:16px}
.tag{font-size:.75rem;color:var(--muted);background:var(--panel);padding:2px 10px;border-radius:99px}
.ok-tag{font-size:.75rem;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:2px 10px;border-radius:99px}
.fcard .big{font-size:clamp(2.2rem,10vw,3.2rem);line-height:1.15}
.fcard .pron{font-size:.95rem;color:var(--muted)}
.fcard .hint{font-size:.8rem;color:var(--faint);margin-top:6px}
.fcard .da{font-size:clamp(1.8rem,8vw,2.4rem);font-weight:700}
.fcard .msa{font-size:.92rem;color:var(--muted)}
.exbox{width:100%;margin-top:8px;padding:14px;border-radius:16px;background:var(--panel);text-align:start;display:flex;flex-direction:column;gap:4px}
.exbox .lbl{font-size:.72rem;font-weight:700;color:var(--faint)}
.exbox .exf{direction:ltr;text-align:left;font-weight:500}
.exbox .exd{color:var(--muted);font-size:.92rem}
.stnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:all .2s}
.round:hover{box-shadow:var(--shadow);border-color:#D3D8F4}
.stact{display:grid;grid-template-columns:auto auto 1fr;gap:10px}
.list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
@media (min-width:900px){.list{grid-template-columns:1fr 1fr}}
.wrow{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 6px 4px 4px;transition:border-color .2s,box-shadow .2s}
.wrow:hover{border-color:#D3D8F4;box-shadow:var(--shadow)}
.wrow .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 10px;text-align:start}
.gdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.gdot.g-m{background:var(--gm)}.gdot.g-f{background:var(--gf)}.gdot.g-n{background:var(--gn)}
.wrow .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.wrow .t .fw{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .t small{color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .chk{color:var(--ok)}
.wrow .spk{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.wrow .spk:hover{background:var(--panel);color:var(--blue)}

/* ---------- quiz ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{text-align:start;padding:14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px;transition:all .2s}
.mode:hover{border-color:#CBD3FA}
.mode[aria-pressed="true"]{border-color:var(--blue);background:var(--soft);box-shadow:0 0 0 3px rgba(84,112,245,.12)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.mode b{font-size:.95rem}
.mode small{color:var(--muted);font-size:.8rem;line-height:1.4}
.qset{display:flex;flex-direction:column;max-width:760px}
.sel{width:100%;padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface)}
.lvl-d{font-size:.84rem;color:var(--muted);margin-top:8px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--panel);font-size:.9rem}
.hist li .s{margin-inline-start:auto;font-weight:700}
.play{max-width:640px;display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .bar{flex:1}
.x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--panel)}
.qcard{padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.qcard .big{font-size:clamp(2rem,9vw,2.8rem);line-height:1.15}
.qcard .da{font-size:clamp(1.7rem,7vw,2.2rem);font-weight:700}
.qcard .ask{color:var(--muted);font-size:.92rem}
.qcard .hintw{direction:ltr;letter-spacing:.3em;color:var(--faint);font-weight:700;margin-top:4px}
.listen{width:96px;height:96px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(110,100,240,.32);position:relative;transition:transform .15s}
.listen:active{transform:scale(.95)}
.listen .ico{width:36px;height:36px}
.listen::before,.listen::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(140,108,240,.28)}
.listen::after{inset:-20px;border-color:rgba(140,108,240,.14)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.c3{grid-template-columns:1fr}
@media (min-width:520px){.opts.c3{grid-template-columns:repeat(3,1fr)}}
.opt{padding:15px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-weight:600;min-width:0;text-align:center;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.55}
.wbox{display:flex;gap:10px}
.wbox input{flex:1;min-width:0;direction:ltr;text-align:left;padding:14px 16px;border-radius:var(--r-sm);border:1.5px solid var(--line);font-size:1.1rem;font-weight:600;outline:none;background:var(--surface)}
.wbox input:focus{border-color:var(--blue)}
.wbox input.ok{border-color:var(--ok);background:var(--ok-soft)}
.wbox input.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:16px;border-radius:16px;display:flex;flex-direction:column;gap:6px;animation:rise .25s ease}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb h3{font-size:1rem}
.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb .line{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.fb .ex{font-size:.88rem;color:var(--muted)}
.fb .ex .fw{font-weight:500}
.qfoot{display:flex;gap:10px}
.qfoot .btn{flex:1}
.res{max-width:560px;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.res-top{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--violet) calc(var(--p)*1%),var(--panel) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}
.ring div{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ring b{font-size:2.2rem;font-weight:800;letter-spacing:-.03em}
.ring span{font-size:.8rem;color:var(--muted)}
.res-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mist li{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--panel)}
.mist small{color:var(--bad);font-size:.82rem;direction:ltr}

/* ---------- brand + exam ---------- */
.logo{width:20px;height:20px;flex:none}
.brand .dot .logo{width:21px;height:21px}
.bname{display:flex;flex-direction:column;line-height:1.15;font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.bname small{font-size:.72rem;font-weight:600;color:var(--muted)}
#navflag{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff}
.nav-brand #navname{font-size:1.15rem;font-weight:800}
.xhome{display:flex;flex-direction:column;gap:16px;max-width:880px}
.xhero{padding:20px;display:flex;gap:16px;align-items:flex-start;background:linear-gradient(135deg,#F4F6FF,#F6F1FF);border-color:#E2E3FA}
.xhero h2{font-size:1.15rem;font-weight:700;margin-bottom:8px}
.xrules{margin:0;padding:0 18px 0 0;display:grid;gap:4px;font-size:.9rem;color:#3B4064}
.xnote{font-size:.82rem;margin-top:8px}
.xreview{padding:18px;display:flex;flex-direction:column;gap:10px;border-color:#F6DDB4;background:linear-gradient(135deg,#FFF9EF,#fff)}
.xr-top{display:flex;gap:14px;align-items:center}
.xr-top h2{font-size:1.15rem}
.xr-top p{font-size:.86rem}
.xreview .btn{align-self:flex-start}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:900px){.xgrid{grid-template-columns:repeat(4,1fr)}}
.xlv{padding:16px;display:flex;flex-direction:column;gap:6px}
.xlv.won{border-color:#CFE9DC;background:linear-gradient(180deg,#F3FBF7,#fff)}
.xlv-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.xbadge{font-weight:800;direction:ltr;font-size:1rem;color:#fff;background:var(--grad);border-radius:12px;padding:6px 10px}
.xmedal{display:flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--ok)}
.xmedal .ico{width:16px;height:16px}
.xlv h3{font-size:1rem;font-weight:700}
.xlv p{font-size:.82rem}
.xbest{color:var(--muted);margin-bottom:6px;flex:1}
.xlv .btn{padding:10px 12px;font-size:.9rem}
.xclock{display:flex;align-items:center;gap:4px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--blue);font-size:.9rem}
.xclock.low{background:var(--bad-soft);color:var(--bad);animation:bump 1s ease infinite}
.xcount{font-size:.85rem;margin-top:-8px}
.xtag{align-self:center;margin-bottom:6px}
.xtag.sm{font-size:.7rem;padding:2px 8px;margin:0}
.xsent{font-size:1.25rem;font-weight:600;line-height:1.5}
.xsent .gap{color:var(--violet);font-weight:800;letter-spacing:.05em}
.opt.pick{border-color:var(--violet);background:var(--vsoft)}
.xwrong{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:end;font-size:.88rem}
.xwrong s{color:var(--bad);text-decoration-thickness:1.5px}
.xwrong b{color:var(--ok)}
.xwin{background:linear-gradient(180deg,#F3FBF7,#fff)}
.xcerts{display:grid;gap:12px}
@media (min-width:720px){.xcerts{grid-template-columns:1fr 1fr}}
.cert{padding:3px;border-radius:22px;background:var(--grad);box-shadow:var(--shadow-lg)}
.cert-in{background:#fff;border-radius:19px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.cert-logo{width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;margin-bottom:6px}
.cert-logo .logo{width:24px;height:24px}
.cert-k{font-size:.78rem;font-weight:700;color:var(--violet);letter-spacing:.04em}
.cert h3{font-size:1.4rem;font-weight:800}
.cert-n{font-weight:700;font-size:1.05rem}

.qnote{display:flex;align-items:center;gap:8px;margin-top:18px;padding:10px 14px;border-radius:var(--r-sm);background:var(--soft);color:#3B4064;font-size:.88rem}
.qnote .ico{width:16px;height:16px;color:var(--blue);stroke-width:2.4}
.xlock{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.xlock .ico{width:15px;height:15px}

/* ---------- chat ---------- */
.chat{max-width:720px;display:flex;flex-direction:column;gap:12px}
.chat .view-head{margin-bottom:0}
.btn.sm .ico{width:16px;height:16px}
.chat-lv{margin:0}
.chat-gate{padding:24px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.chat-gate h2{font-size:1.2rem}
.chat-list{display:flex;flex-direction:column;gap:12px;min-height:240px;max-height:calc(100dvh - 370px);overflow-y:auto;padding:14px;border-radius:var(--r);background:var(--panel)}
@media (min-width:900px){.chat-list{max-height:calc(100vh - 290px)}}
.msg{display:flex;flex-direction:column;gap:6px;max-width:86%}
.msg.bot{align-self:flex-end}
.msg.me{align-self:flex-start;align-items:flex-start}
.bub{padding:11px 14px;border-radius:18px;line-height:1.5}
.bub .fw{font-weight:500}
.msg.bot .bub{background:var(--surface);border:1px solid var(--line);border-top-right-radius:6px}
.msg.me .bub{background:var(--grad);color:#fff;border-top-left-radius:6px}
.bub .tr{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted);font-size:.9rem}
.mact{display:flex;gap:10px;margin-top:6px}
.mact button{display:flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;color:var(--blue)}
.mact .ico{width:16px;height:16px}
.fix{background:#FFF6E8;border:1px solid #F8DFB4;border-radius:14px;padding:9px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.fix .lbl{font-size:.72rem;font-weight:700;color:#B26B00}
.fix .fw{font-weight:600}
.fix .why{color:#5B4A2A}
.fix.ok{flex-direction:row;align-items:center;gap:6px;background:var(--ok-soft);border-color:#CDEBDC;color:var(--ok);font-weight:600}
.fix.ok .ico{width:16px;height:16px;stroke-width:2.4}
.typing{display:flex;gap:4px;align-items:center;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.3}}
.chat-in{display:flex;gap:8px}
.chat-in input{flex:1;min-width:0;padding:13px 16px;border-radius:var(--r-sm);border:1.5px solid var(--line);font-size:1rem;outline:none;background:var(--surface);text-align:left}
.chat-in input:focus{border-color:var(--blue)}
.chat-in .btn{padding:12px 14px}
.chat-in .ico{transform:scaleX(-1)}
.chat-note{font-size:.76rem;color:var(--faint)}

/* ---------- daily lessons + practice ---------- */
.ltags{display:flex;gap:8px;align-self:flex-start}
.lat{direction:ltr;unicode-bidi:isolate;font-weight:600}
.ltip{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-sm);background:var(--vsoft);color:#3B3270;font-size:.93rem;line-height:1.7}
.ltip .ico{color:var(--violet);margin-top:3px;width:18px;height:18px}
.lnext{display:flex;align-items:center;gap:6px;font-size:.88rem}
.lnext .ico{width:16px;height:16px}
.ltitle{grid-column:1/-1;margin:14px 0 2px}
.lesson.locked{opacity:.55;cursor:default}
.lesson.locked:hover{transform:none;box-shadow:var(--shadow)}
.tday{display:flex;align-items:center;gap:14px;padding:16px;text-align:start;width:100%;margin-bottom:16px;transition:transform .2s,box-shadow .2s}
button.tday:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tday>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tday h3{font-size:1rem}
.tday p{font-size:.85rem}
.home .tday{margin:12px 0 0}
.prac{padding:16px;display:flex;flex-direction:column;gap:14px}
.prac-h{display:flex;gap:12px;align-items:center}
.prac-h h3{font-size:1rem}
.prac-h p{font-size:.84rem}
.prac-wait{display:flex;align-items:center;gap:8px}
.prac-wait .typing{padding:0}
.pq{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.pq-q{font-weight:600}
.pq .opt{padding:11px 10px}
.pq-x{font-size:.88rem;padding:8px 12px;border-radius:12px}
.pq-x.ok{background:var(--ok-soft);color:var(--ok)}
.pq-x.bad{background:var(--bad-soft);color:var(--bad)}
.prac-end{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}

/* ---------- progress ---------- */
.prog{display:grid;gap:16px}
@media (min-width:900px){.prog{grid-template-columns:1fr 1fr;align-items:start}}
.pcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.overview{padding:22px;display:flex;align-items:center;gap:20px}
.overview .ring{width:120px;height:120px}
.overview .ring b{font-size:1.7rem}
.ov-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.ov-t h2{font-size:1.15rem}
.ov-t .bar{height:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat .e{font-size:1.4rem;line-height:1.2}
.stat b{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:.78rem;color:var(--muted)}
.box{padding:18px}
.box h2{font-size:1.02rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.week{display:flex;flex-direction:column;gap:8px;padding-top:22px}
.plot{position:relative;height:100px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line)}
.plot .goal{position:absolute;inset-inline:0;border-top:1.5px dashed #D4D8EC;z-index:0}
.plot .goal span{position:absolute;top:-18px;inset-inline-start:0;font-size:.7rem;color:var(--faint)}
.col{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.col i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--panel)}
.col i.hit{background:var(--grad)}
.col i.some{background:#C9D2FB}
.col b{font-size:.72rem;font-weight:700}
.labels{display:flex;gap:8px}
.labels span{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.labels span.today{color:var(--blue);font-weight:700}
.cal-h{display:flex;align-items:center;gap:6px}
.cal-h button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.cal-h button:hover{background:var(--panel)}
.cal-h button:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dn{font-size:.72rem;color:var(--faint);font-weight:700}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-size:.82rem;font-weight:600;color:var(--muted)}
.cal .d.some{background:var(--soft);color:var(--blue)}
.cal .d.hit{background:var(--grad);color:#fff}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cal-l{display:flex;gap:14px;font-size:.76rem;color:var(--muted);margin-top:12px}
.cal-l span{display:flex;align-items:center;gap:6px}
.cal-l i{width:12px;height:12px;border-radius:4px}
.topics{display:grid;gap:12px}
.trow{display:grid;grid-template-columns:7.5rem 1fr auto;gap:12px;align-items:center;font-size:.88rem}
.trow .bar{height:7px}
.trow b{font-weight:600;font-size:.8rem;color:var(--muted)}
.danger-zone{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding-top:6px}
.link{color:var(--muted);font-size:.86rem;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* ---------- grammar ---------- */
.lessons{display:grid;gap:10px}
@media (min-width:900px){.lessons{grid-template-columns:1fr 1fr}}
.lesson{text-align:start;padding:16px;display:flex;align-items:center;gap:14px;transition:transform .2s,box-shadow .2s}
.lesson:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.lesson .n{width:38px;height:38px;border-radius:12px;background:var(--vsoft);color:var(--violet);display:grid;place-items:center;font-weight:800;flex:none}
.lesson.done .n{background:var(--ok-soft);color:var(--ok)}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block}
.lesson .t small{color:var(--muted)}
.lview{max-width:640px;display:flex;flex-direction:column;gap:16px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:.9rem}
.back:hover{color:var(--ink)}
.lview h1{font-size:1.6rem}
.lview .d{font-size:1rem;color:#3B4064;line-height:1.8}
.ltable{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ltable div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.ltable div:first-child{border-top:0}
.ltable .fw{font-size:1.05rem}
.ltable button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ltable button:hover{background:var(--panel);color:var(--blue)}
.ltable .r{display:flex;align-items:center;gap:6px}

/* ---------- friends ---------- */
.fr-wrap{max-width:620px;display:flex;flex-direction:column;gap:14px}
.nick{display:flex;gap:8px}
.nick input{flex:1;min-width:0;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);outline:none}
.nick input:focus{border-color:var(--blue)}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:12px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.board li.me{background:var(--soft)}
.board .r{font-weight:800;color:var(--faint)}
.board li:nth-child(1) .r{color:#D9A10B}.board li:nth-child(2) .r{color:#8F97AE}.board li:nth-child(3) .r{color:#C47A3E}
.board .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.board .n small{color:var(--muted);font-weight:400;margin-inline-start:6px}
.board .s{font-weight:700}
.note{font-size:.88rem;color:var(--muted)}

/* ---------- levels & account ---------- */
.lvrow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.lvb{min-width:52px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:.85rem;color:var(--muted);background:var(--surface);transition:all .2s}
.lvb:hover{color:var(--ink);border-color:#CBD3FA}
.lvb[aria-pressed="true"]{border-color:var(--blue);background:var(--soft);color:var(--blue)}
.tag.lv{background:var(--soft);color:var(--blue);font-weight:700;direction:ltr}
.lvls{display:grid;gap:6px}
.lvl-row{display:grid;grid-template-columns:2.6rem 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;text-align:start;transition:background .2s}
.lvl-row:hover{background:var(--panel)}
.lvl-row.cur{background:var(--soft)}
.lvl-row b{direction:ltr;font-weight:800}
.lvl-row .bar{height:8px}
.tlv{display:flex;justify-content:space-between;font-weight:800;font-size:.85rem;color:var(--blue);margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.tlv:first-child{border-top:0;padding-top:0;margin-top:0}
.tlv span{direction:ltr}
.avatar{position:relative;width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.avatar .ico{width:18px;height:18px}
.avatar .st{position:absolute;bottom:-1px;inset-inline-end:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--faint)}
.avatar .st.ok{background:var(--ok)}.avatar .st.warn{background:var(--warm)}
.topbar .pills{margin-inline-start:0}
.topbar .switch{margin-inline-end:auto}
.wel-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.accchip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:var(--panel);font-size:.85rem;font-weight:600;color:var(--muted)}
.accchip.on{background:var(--ok-soft);color:var(--ok)}
.av{border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.av.sm{width:22px;height:22px;font-size:.75rem}.av.sm .ico{width:13px;height:13px}
.av.lg{width:64px;height:64px;font-size:1.6rem}.av.lg .ico{width:28px;height:28px}
.acc-head{padding:20px;display:flex;align-items:center;gap:16px}
.acc-head h2{font-size:1.25rem}
.sync{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:.9rem;background:var(--panel)}
.sync i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--faint)}
.sync.ok{background:var(--ok-soft);color:#14764F}.sync.ok i{background:var(--ok)}
.sync.warn{background:#FFF6E6;color:#8A5A0B}.sync.warn i{background:var(--warm)}
.sync.bad{background:var(--bad-soft);color:#A3303A}.sync.bad i{background:var(--bad)}
.acc-ls{display:grid;gap:12px}
.acc-l{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.9rem}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:.92rem}
.howto li{display:flex;gap:10px;align-items:flex-start}
.howto .ico{width:18px;height:18px;color:var(--violet);margin-top:3px;stroke-width:2.4}

.vrow{grid-template-columns:2.6rem 1fr auto}

<script>
/* Turns Firebase into the same small interface the app already uses (claude.use("user") / claude.use("db")). */
(function(){
 if(!window.FIREBASE_CONFIG||typeof firebase==="undefined"||window.claude)return;
 try{firebase.initializeApp(window.FIREBASE_CONFIG)}catch(e){console.error("Firebase config error",e);return}
 var auth=firebase.auth(),fs=firebase.firestore();
 var ready=new Promise(function(res){var un=auth.onAuthStateChanged(function(u){un();res(u)})});
 var user={me:function(){return ready.then(function(u){return u?{id:u.uid,name:u.displayName||""}:{id:null,name:""}})},can:function(){return true}};
 window.claude={use:function(n){return ready.then(function(u){return n==="user"?user:n==="db"?(u?fs:null):null})}};
 var provider=new firebase.auth.GoogleAuthProvider();
 window.LINGO_AUTH={
  signIn:function(){return auth.signInWithPopup(provider).catch(function(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))return auth.signInWithRedirect(provider);throw e}).then(function(){location.reload()})},
  signOut:function(){return auth.signOut().then(function(){location.reload()})},
  token:function(){return ready.then(function(){return auth.currentUser?auth.currentUser.getIdToken():null})}
 };
})();
</script>

 {lvl:"A1",t:"Le pluriel — الجمع",d:"لجمع الاسم في الفرنسية نضيف غالبًا s في آخره، وهي لا تُنطق: un livre ← des livres. الكلمات التي تنتهي بـ eau أو eu تأخذ x: un gâteau ← des gâteaux. والتي تنتهي بـ al تصبح غالبًا aux: un journal ← des journaux. والكلمات التي تنتهي أصلًا بـ s أو x أو z لا تتغيّر.",r:[["un livre → des livres","كتاب ← كتب"],["une pomme → des pommes","تفاحة ← تفاحات"],["un gâteau → des gâteaux","كعكة ← كعكات"],["un journal → des journaux","جريدة ← جرائد"],["un bras → des bras","ذراع ← أذرع"]],tip:"بما أن s لا تُنطق، فإن الأداة (le / les، un / des) هي التي تُسمعك أن الكلمة جمع."},
 {lvl:"A1",t:"Les adjectifs — الصفة",d:"الصفة في الفرنسية تتبع الاسم في الجنس والعدد. للمؤنث نضيف غالبًا e: grand ← grande. وللجمع نضيف s: grands، grandes. وأغلب الصفات تأتي بعد الاسم: une voiture rouge. لكن بعض الصفات القصيرة الشائعة تأتي قبله، مثل: beau، petit، grand، bon، jeune، vieux، nouveau.",r:[["un garçon grand","ولد طويل"],["une fille grande","بنت طويلة"],["des livres intéressants","كتب مثيرة للاهتمام"],["une voiture rouge","سيارة حمراء"],["un petit chat","قط صغير"],["une belle maison","بيت جميل"]],tip:"بعض الصفات تتغيّر أكثر في المؤنث: beau ← belle، vieux ← vieille، nouveau ← nouvelle، heureux ← heureuse."},
 {lvl:"A1",t:"Les verbes en -er — الأفعال المنتهية بـ er",d:"أغلب الأفعال الفرنسية تنتهي بـ er، مثل parler و aimer. لتصريفها في الحاضر نحذف er ونضيف النهايات: e، es، e، ons، ez، ent. النهايات e و es و ent لا تُنطق، لذلك تُنطق je parle و tu parles و ils parlent بنفس الطريقة.",r:[["je parle","أنا أتكلم"],["tu parles","أنتَ تتكلم"],["il / elle parle","هو / هي يتكلم"],["nous parlons","نحن نتكلم"],["vous parlez","أنتم تتكلمون"],["ils / elles parlent","هم يتكلمون"]],tip:"قبل حرف العلة تصبح je هي j’: j’aime، j’habite، j’écoute."},
 {lvl:"A1",t:"Aller, Faire, Venir — أفعال شاذة مهمة",d:"بعض الأفعال الكثيرة الاستعمال لا تتبع القاعدة ويجب حفظها. aller يعني «ذهب»، و faire يعني «فعل / صنع»، و venir يعني «جاء». نستعمل aller مع à: je vais à l’école، و venir مع de: je viens du Maroc.",r:[["je vais, tu vas, il va","أذهب، تذهب، يذهب"],["nous allons, vous allez, ils vont","نذهب، تذهبون، يذهبون"],["je fais, tu fais, il fait","أفعل، تفعل، يفعل"],["nous faisons, vous faites, ils font","نفعل، تفعلون، يفعلون"],["je viens, tu viens, il vient","آتي، تأتي، يأتي"],["nous venons, vous venez, ils viennent","نأتي، تأتون، يأتون"]],tip:"faire يدخل في عبارات كثيرة: faire du sport (مارس الرياضة)، faire les courses (تسوّق)، il fait beau (الطقس جميل)."},
 {lvl:"A1",t:"Poser une question — طرح السؤال",d:"هناك ثلاث طرق لطرح سؤال بنعم أو لا: نرفع الصوت في آخر الجملة (Tu viens ?)، أو نضيف est-ce que في البداية (Est-ce que tu viens ?)، أو نقلب الفعل والضمير بطريقة رسمية (Viens-tu ?). ولطرح سؤال مفتوح نستعمل كلمات الاستفهام: où، quand، comment، pourquoi، qui، que / quoi، combien.",r:[["Tu parles français ?","هل تتكلم الفرنسية؟"],["Est-ce que tu as faim ?","هل أنت جائع؟"],["Où est la gare ?","أين المحطة؟"],["Quand est-ce que tu pars ?","متى تغادر؟"],["Comment tu t’appelles ?","ما اسمك؟"],["Pourquoi tu ris ?","لماذا تضحك؟"]],tip:"في الكلام اليومي، رفع الصوت هو الأكثر استعمالًا. و est-ce que مفيدة وسهلة لأنها لا تغيّر ترتيب الجملة."},
 {lvl:"A1",t:"Mon, Ma, Mes — أدوات الملكية",d:"أدوات الملكية تتبع الاسم المملوك لا المالك. للمفرد المذكر: mon، ton، son. للمفرد المؤنث: ma، ta، sa. وللجمع: mes، tes، ses. ومع الجماعة: notre / nos، votre / vos، leur / leurs. وقبل اسم مؤنث يبدأ بحرف علة نستعمل mon بدل ma: mon amie.",r:[["mon père","أبي","m"],["ma mère","أمي","f"],["mes parents","والداي",""],["son livre","كتابه / كتابها","m"],["notre maison","بيتنا","f"],["mon amie","صديقتي","f"]],tip:"son و sa تعنيان «ـه» و«ـها» معًا: sa voiture قد تعني سيارته أو سيارتها، لأن الأداة تتبع كلمة voiture المؤنثة."},
 {lvl:"A1",t:"À, Au, En — حروف المكان",d:"نستعمل à مع المدن: à Rabat، à Paris. ونستعمل en مع أغلب البلدان المؤنثة (التي تنتهي غالبًا بـ e): en France، en Espagne. ونستعمل au مع البلدان المذكرة: au Maroc، au Canada، و aux مع الجمع: aux États-Unis. وتندمج à مع le لتصبح au: je vais au marché.",r:[["J’habite à Casablanca.","أسكن في الدار البيضاء."],["Je vis au Maroc.","أعيش في المغرب."],["Il travaille en France.","يعمل في فرنسا."],["Elle va aux États-Unis.","تذهب إلى الولايات المتحدة."],["Je vais au marché.","أذهب إلى السوق."],["Je vais à la plage.","أذهب إلى الشاطئ."]],tip:"à + le = au، و à + les = aux. أما à la و à l’ فلا تتغيّران."},
 {lvl:"A1",t:"Il y a — يوجد / هناك",d:"عبارة il y a تعني «يوجد» أو «هناك»، ولا تتغيّر مع المفرد أو الجمع. في النفي نقول il n’y a pas de. وتُستعمل أيضًا مع الزمن بمعنى «منذ»: il y a deux jours = منذ يومين.",r:[["Il y a un chat dans le jardin.","يوجد قط في الحديقة."],["Il y a beaucoup de monde.","هناك ناس كثيرون."],["Il n’y a pas de pain.","لا يوجد خبز."],["Qu’est-ce qu’il y a ?","ماذا هناك؟ / ما الأمر؟"],["Je suis arrivé il y a deux jours.","وصلت منذ يومين."]],tip:"بعد النفي تصبح un و une و des هي de: il y a un problème ← il n’y a pas de problème."},
 {lvl:"A2",t:"Finir, Prendre — أفعال ir و re في الحاضر",d:"إلى جانب أفعال er، هناك مجموعتان مهمتان. أفعال ir مثل finir و choisir: نحذف ir ونضيف is، is، it، issons، issez، issent. وأفعال re مثل attendre و vendre: نحذف re ونضيف s، s، (لا شيء)، ons، ez، ent. أما prendre (وأخواته apprendre و comprendre) فشاذ: je prends، nous prenons، ils prennent.",r:[["je finis, nous finissons, ils finissent","أنهي، ننهي، ينهون"],["je choisis un livre","أختار كتابًا"],["j’attends, il attend, ils attendent","أنتظر، ينتظر، ينتظرون"],["je prends, nous prenons, ils prennent","آخذ، نأخذ، يأخذون"],["Tu comprends ?","هل تفهم؟"]],tip:"في أفعال re لا يُنطق الحرف الأخير مع je و tu و il: j’attends و il attend تُنطقان بنفس الطريقة."},
 {lvl:"A2",t:"Pouvoir, Vouloir, Devoir — القدرة والرغبة والواجب",d:"هذه الأفعال الثلاثة شاذة وتأتي بعدها أفعال في المصدر. pouvoir = استطاع (أو طلب الإذن)، و vouloir = أراد، و devoir = وجب عليه. جذورها تتغيّر: je peux، nous pouvons، ils peuvent / je veux، nous voulons، ils veulent / je dois، nous devons، ils doivent.",r:[["Je peux t’aider.","أستطيع مساعدتك."],["Est-ce que je peux entrer ?","هل يمكنني الدخول؟"],["Elle veut voyager.","تريد أن تسافر."],["Nous voulons apprendre.","نريد أن نتعلم."],["Tu dois dormir tôt.","يجب أن تنام باكرًا."],["Ils doivent partir.","يجب أن يغادروا."]],tip:"للطلب بأدب استعمل الشرطي: je voudrais (أودّ) و pourriez-vous (هل يمكنكم)."},
 {lvl:"A2",t:"Le passé composé avec avoir — الماضي المركّب مع avoir",d:"نستعمل الماضي المركّب للتحدث عن فعل انتهى في الماضي. يتكوّن من avoir في الحاضر + اسم المفعول. اسم مفعول أفعال er ينتهي بـ é: parler ← parlé. وأفعال ir تنتهي غالبًا بـ i: finir ← fini. وهناك أفعال شاذة يجب حفظها: faire ← fait، prendre ← pris، voir ← vu، avoir ← eu، être ← été.",r:[["J’ai mangé un sandwich.","أكلت شطيرة."],["Tu as fini tes devoirs ?","هل أنهيت واجباتك؟"],["Il a pris le bus.","أخذ الحافلة."],["Nous avons vu un film.","شاهدنا فيلمًا."],["Ils ont fait du sport.","مارسوا الرياضة."],["Je n’ai pas compris.","لم أفهم."]],tip:"في النفي، ne … pas تحيط بالفعل المساعد فقط: je n’ai pas mangé."},
 {lvl:"A2",t:"Le passé composé avec être — الماضي المركّب مع être",d:"بعض أفعال الحركة وتغيّر الحالة تستعمل être بدل avoir، مثل: aller، venir، arriver، partir، entrer، sortir، monter، descendre، naître، mourir، rester، tomber، retourner. ومع être يتبع اسم المفعول الفاعل في الجنس والعدد: elle est allée، ils sont partis. والأفعال الانعكاسية (se lever…) تستعمل أيضًا être.",r:[["Je suis allé au cinéma.","ذهبتُ إلى السينما (مذكر)."],["Elle est arrivée hier.","وصلت أمس."],["Nous sommes partis tôt.","غادرنا باكرًا."],["Elles sont restées à la maison.","بقين في البيت."],["Il est né en 2005.","وُلد سنة 2005."],["Je me suis levé à sept heures.","استيقظت في الساعة السابعة."]],tip:"لتذكّر هذه الأفعال تخيّل بيتًا: نأتي، ندخل، نصعد، نبقى، ننزل، نخرج، نذهب… كلها حركة."},
 {lvl:"A2",t:"Les verbes pronominaux — الأفعال الانعكاسية",d:"بعض الأفعال تُصرَّف مع ضمير إضافي يعود على الفاعل: me، te، se، nous، vous، se. مثل se lever (نهض)، se laver (اغتسل)، s’appeler (تسمّى)، se reposer (استراح). قبل حرف العلة تصبح me و te و se هي m’ و t’ و s’. وفي الماضي المركّب تستعمل دائمًا être.",r:[["Je me lève à sept heures.","أستيقظ في الساعة السابعة."],["Tu te reposes ?","هل تستريح؟"],["Il s’appelle Karim.","اسمه كريم."],["Nous nous habillons.","نلبس ثيابنا."],["Ils se lavent les mains.","يغسلون أيديهم."],["Elle s’est réveillée tard.","استيقظت متأخرة."]],tip:"في النفي: je ne me lève pas. الضمير يبقى ملتصقًا بالفعل داخل ne … pas."},
 {lvl:"A2",t:"L’imparfait — الماضي الناقص",d:"نستعمل imparfait لوصف الماضي: العادات (كنت أفعل)، والحالات (كان الجو…)، والخلفية التي يقع فيها حدث. نأخذ جذر nous في الحاضر ونحذف ons ثم نضيف: ais، ais، ait، ions، iez، aient. مثال: nous parlons ← je parlais. والفعل الشاذ الوحيد هو être: j’étais.",r:[["Quand j’étais petit, j’habitais à Fès.","عندما كنت صغيرًا كنت أسكن في فاس."],["Il faisait beau.","كان الطقس جميلًا."],["Nous jouions au foot tous les jours.","كنا نلعب كرة القدم كل يوم."],["Elle avait vingt ans.","كان عمرها عشرين سنة."],["Je dormais quand tu as appelé.","كنت نائمًا عندما اتصلت."]],tip:"الفرق باختصار: imparfait = الخلفية والعادة (كان يحدث)، و passé composé = حدث وقع وانتهى (حدث)."},
 {lvl:"A2",t:"Le futur proche — المستقبل القريب",d:"للتحدث عن شيء سيحدث قريبًا أو عن نية، نستعمل aller في الحاضر + الفعل في المصدر: je vais manger = سآكل. هذه هي أسهل طريقة للتعبير عن المستقبل وأكثرها استعمالًا في الكلام اليومي.",r:[["Je vais partir demain.","سأغادر غدًا."],["Tu vas venir ce soir ?","هل ستأتي هذا المساء؟"],["Il va pleuvoir.","ستمطر."],["Nous allons voyager en été.","سنسافر في الصيف."],["Je ne vais pas sortir.","لن أخرج."]],tip:"في النفي، ne … pas تحيط بالفعل aller: je ne vais pas travailler."},
 {lvl:"A2",t:"Venir de — الماضي القريب",d:"للتعبير عن فعل انتهى قبل قليل نستعمل venir في الحاضر + de + الفعل في المصدر: je viens de manger = أكلتُ للتو. إنها نظير المستقبل القريب (aller + مصدر)، لكن في الماضي.",r:[["Je viens de manger.","أكلتُ للتو."],["Il vient de partir.","غادر للتو."],["Nous venons d’arriver.","وصلنا للتو."],["Elle vient de finir son travail.","أنهت عملها للتو."],["Tu viens de rater le bus !","فاتتك الحافلة للتو!"]],tip:"قبل حرف العلة تصبح de هي d’: je viens d’arriver."},
 {lvl:"A2",t:"L’impératif — صيغة الأمر",d:"نستعمل الأمر لإعطاء أوامر أو نصائح. له ثلاث صيغ فقط: tu، nous، vous، بدون ضمير. نأخذ تصريف الحاضر ونحذف الضمير. وفي أفعال er نحذف s من صيغة tu: tu parles ← parle. وهناك أفعال شاذة: être ← sois، soyons، soyez / avoir ← aie، ayons، ayez.",r:[["Parle plus lentement !","تكلّم ببطء!"],["Mangeons ensemble.","لنأكل معًا."],["Écoutez bien.","استمعوا جيدًا."],["Ne touche pas !","لا تلمس!"],["Sois gentil.","كن لطيفًا."],["Lève-toi !","انهض!"]],tip:"مع الأفعال الانعكاسية يأتي الضمير بعد الفعل في الإثبات (lève-toi) وقبله في النفي (ne te lève pas)."},
 {lvl:"A2",t:"Le, La, Les — ضمائر المفعول به",d:"لتجنّب تكرار الاسم نستبدله بضمير مفعول به: le للمذكر، و la للمؤنث، و l’ قبل حرف علة، و les للجمع. ويوضع الضمير قبل الفعل: Tu vois le bus ? — Oui, je le vois. وللأشخاص نستعمل أيضًا me، te، nous، vous.",r:[["Tu aimes ce film ? — Oui, je l’aime.","هل تحب هذا الفيلم؟ — نعم، أحبه."],["Tu connais Sara ? — Oui, je la connais.","هل تعرف سارة؟ — نعم، أعرفها."],["Je prends les clés. → Je les prends.","آخذ المفاتيح ← آخذها."],["Il me regarde.","هو ينظر إليّ."],["Je ne le comprends pas.","لا أفهمه."]],tip:"مع الماضي المركّب يبقى الضمير قبل الفعل المساعد: je l’ai vu (رأيته)."},
 {lvl:"A2",t:"Lui, Leur — ضمائر المفعول غير المباشر",d:"عندما يأتي بعد الفعل à + شخص، نستعمل ضمير المفعول غير المباشر: lui لشخص واحد (مذكرًا أو مؤنثًا)، و leur للجمع، و me، te، nous، vous. أفعال كثيرة تعمل هكذا: parler à، téléphoner à، donner à، dire à، écrire à، répondre à.",r:[["Je parle à Sara. → Je lui parle.","أكلّم سارة ← أكلّمها."],["Je téléphone à mes parents. → Je leur téléphone.","أتصل بوالديّ ← أتصل بهما."],["Il me donne un cadeau.","يعطيني هدية."],["Tu lui as répondu ?","هل أجبته؟"],["Je ne leur dis rien.","لا أقول لهم شيئًا."]],tip:"لا تخلط: le / la للمفعول المباشر (je la vois)، و lui للمفعول غير المباشر (je lui parle)."},
 {lvl:"A2",t:"Du, De la, Des — أداة التبعيض",d:"عندما نتحدث عن كمية غير محددة من شيء (بعض الخبز، شيء من الماء) نستعمل du مع المذكر، و de la مع المؤنث، و de l’ قبل حرف علة، و des مع الجمع. وبعد النفي أو بعد كلمات الكمية (beaucoup، un peu، un kilo) تصبح كلها de.",r:[["Je mange du pain.","آكل خبزًا."],["Je bois de la soupe.","أشرب حساءً."],["Tu veux de l’eau ?","هل تريد ماءً؟"],["Elle achète des fruits.","تشتري فواكه."],["Je ne mange pas de viande.","لا آكل اللحم."],["Beaucoup de sucre.","كثير من السكر."]],tip:"مع أفعال الذوق (aimer، adorer، détester) نستعمل le / la / les: j’aime le café، لكن je bois du café."},
 {lvl:"A2",t:"Ne … jamais, rien, personne, plus — أنواع النفي",d:"إلى جانب ne … pas هناك صيغ نفي أخرى: ne … jamais (أبدًا)، ne … rien (لا شيء)، ne … personne (لا أحد)، ne … plus (لم يعد)، ne … que (فقط). وتأخذ نفس مكان pas في الجملة. في الكلام اليومي يحذف الفرنسيون أحيانًا ne، لكن في الكتابة يجب أن نكتبها.",r:[["Je ne fume jamais.","لا أدخّن أبدًا."],["Je ne vois rien.","لا أرى شيئًا."],["Il n’y a personne.","لا يوجد أحد."],["Je ne travaille plus ici.","لم أعد أعمل هنا."],["Je n’ai que dix dirhams.","ليس لدي إلا عشرة دراهم."],["Personne ne sait.","لا أحد يعرف."]],tip:"في الماضي المركّب تأتي rien و jamais و plus قبل اسم المفعول (je n’ai rien vu)، أما personne فتأتي بعده (je n’ai vu personne)."},
 {lvl:"A2",t:"Quel, Quelle — أي؟ / ما؟",d:"quel كلمة استفهام تعني «أيّ» أو «ما»، وتتبع الاسم في الجنس والعدد: quel للمذكر، و quelle للمؤنث، و quels و quelles للجمع. وتُستعمل أيضًا للتعجّب: Quelle belle journée !",r:[["Quel âge as-tu ?","كم عمرك؟"],["Quelle heure est-il ?","كم الساعة؟"],["Quel est ton nom ?","ما اسمك؟"],["Quelles langues parles-tu ?","ما اللغات التي تتكلمها؟"],["Quelle belle maison !","يا له من بيت جميل!"]],tip:"الصيغ الأربع تُنطق بنفس الطريقة «كيل»، الفرق يظهر فقط في الكتابة."},
 {lvl:"A2",t:"Depuis, Pendant, Il y a — التعبير عن المدة",d:"depuis تعني «منذ» لشيء بدأ في الماضي وما زال مستمرًا، ونستعمل معها الحاضر. و pendant تعني «خلال / لمدة» لمدة محددة انتهت أو ستنتهي. و il y a + مدة تعني «منذ» (قبل) لحدث انتهى في الماضي.",r:[["J’habite ici depuis trois ans.","أسكن هنا منذ ثلاث سنوات."],["J’apprends le français depuis janvier.","أتعلم الفرنسية منذ يناير."],["J’ai dormi pendant huit heures.","نمت لمدة ثماني ساعات."],["Pendant les vacances, je voyage.","خلال العطلة أسافر."],["Je suis arrivé il y a une semaine.","وصلت منذ أسبوع."]],tip:"احذر: «أسكن هنا منذ سنتين» = j’habite ici depuis deux ans (بالحاضر)، وليس j’ai habité."},
 {lvl:"A2",t:"Les adverbes en -ment — الظروف المنتهية بـ ment",d:"لصنع ظرف من صفة نضيف ment إلى صيغة المؤنث: lent ← lente ← lentement. إذا انتهت الصفة بحرف علة نضيف ment مباشرة: vrai ← vraiment، poli ← poliment. والصفات المنتهية بـ ant و ent تصبح amment و emment: courant ← couramment، évident ← évidemment.",r:[["lent → lentement","بطيء ← ببطء"],["heureux → heureusement","سعيد ← لحسن الحظ"],["vrai → vraiment","حقيقي ← حقًا"],["rapide → rapidement","سريع ← بسرعة"],["Il parle couramment arabe.","يتكلم العربية بطلاقة."],["Évidemment, je viens !","طبعًا سآتي!"]],tip:"بعض الظروف الشائعة شاذة: bon ← bien، mauvais ← mal."},
 {lvl:"A2",t:"Tout, Toute, Tous, Toutes — كل / جميع",d:"tout يتبع الاسم في الجنس والعدد: tout le (المذكر)، toute la (المؤنث)، tous les (جمع المذكر)، toutes les (جمع المؤنث). tout le monde تعني «الجميع / كل الناس» والفعل بعدها مفرد. و tous les jours تعني «كل يوم».",r:[["tout le temps","طوال الوقت"],["toute la journée","طوال اليوم"],["tous les jours","كل يوم"],["toutes les semaines","كل أسبوع"],["Tout le monde est là.","الجميع هنا."],["C’est tout.","هذا كل شيء."]],tip:"tous تُنطق «تو» قبل الاسم (tous les jours)، و«توس» عندما تكون ضميرًا وحدها (ils sont tous là)."},
 {lvl:"A2",t:"Les connecteurs simples — أدوات الربط البسيطة",d:"أدوات الربط تجعل كلامك متصلًا وطبيعيًا. et (و) تجمع، و mais (لكن) تعارض، و ou (أو) تخيّر، و parce que (لأن) تعطي السبب، و donc / alors (إذن، لذلك) تعطي النتيجة، و quand (عندما) تحدد الزمن.",r:[["J’aime le thé et le café.","أحب الشاي والقهوة."],["Il est riche mais il n’est pas heureux.","هو غني لكنه ليس سعيدًا."],["Tu veux du thé ou du café ?","تريد شايًا أم قهوة؟"],["Je reste à la maison parce que je suis malade.","أبقى في البيت لأنني مريض."],["Il pleut, donc je prends un parapluie.","إنها تمطر، لذلك آخذ مظلة."],["Quand il fait beau, je vais à la plage.","عندما يكون الطقس جميلًا أذهب إلى الشاطئ."]],tip:"قبل il و elle تصبح parce que هي parce qu’: parce qu’il est fatigué."},
 {lvl:"A2",t:"Plus, Moins, Aussi … que — المقارنة",d:"للمقارنة نضع plus (أكثر) أو moins (أقل) أو aussi (بنفس القدر) قبل الصفة، ثم que قبل الطرف الثاني: Paris est plus grand que Rabat. ومع الأفعال نستعمل plus، moins، autant. وهناك صيغ شاذة: bon ← meilleur، bien ← mieux.",r:[["Sara est plus grande que Karim.","سارة أطول من كريم."],["Le bus est moins rapide que le train.","الحافلة أقل سرعة من القطار."],["Il est aussi intelligent que son frère.","هو ذكي مثل أخيه."],["Ce gâteau est meilleur.","هذه الكعكة أفضل."],["Elle parle mieux que moi.","هي تتكلم أفضل مني."],["C’est le plus beau jour de ma vie.","إنه أجمل يوم في حياتي."]],tip:"لا تقل plus bon، بل meilleur. ولا تقل plus bien، بل mieux."},
 {lvl:"A2",t:"Le superlatif — صيغة التفضيل",d:"للتعبير عن «الأكثر» أو «الأقل» نستعمل le / la / les + plus أو moins + الصفة. وإذا كانت الصفة بعد الاسم نكرّر الأداة: la ville la plus belle. ولذكر المجموعة نستعمل de: le plus grand du monde. وهناك صيغ شاذة: le meilleur (الأفضل)، le mieux.",r:[["C’est le plus grand pays d’Afrique.","إنه أكبر بلد في إفريقيا."],["C’est la ville la plus belle du Maroc.","إنها أجمل مدينة في المغرب."],["C’est l’exercice le moins difficile.","إنه أقل التمارين صعوبة."],["Il est le meilleur joueur.","هو أفضل لاعب."],["C’est elle qui parle le mieux.","هي التي تتكلم أفضل من الجميع."]],tip:"de + le = du، و de + les = des: le plus beau du monde، la plus jeune des filles."},
 {lvl:"B1",t:"Le futur simple — المستقبل البسيط",d:"يُستعمل المستقبل البسيط للخطط البعيدة والتوقعات والوعود. نأخذ المصدر ونضيف: ai، as، a، ons، ez، ont (وتُحذف e الأخيرة من أفعال re: prendre ← je prendrai). بعض الأفعال لها جذر شاذ: être ← ser، avoir ← aur، aller ← ir، faire ← fer، venir ← viendr، pouvoir ← pourr، vouloir ← voudr.",r:[["Je partirai demain.","سأغادر غدًا."],["Tu seras content.","ستكون مسرورًا."],["Il fera beau ce week-end.","سيكون الطقس جميلًا نهاية الأسبوع."],["Nous irons au Maroc.","سنذهب إلى المغرب."],["Ils auront leur diplôme en juin.","سيحصلون على شهادتهم في يونيو."]],tip:"بعد quand نستعمل المستقبل في الفرنسية (وليس الحاضر): Quand je serai grand, je serai médecin."},
 {lvl:"B1",t:"Le conditionnel présent — الشرطي",d:"يُستعمل الشرطي للطلب بأدب (je voudrais)، وللنصيحة (tu devrais)، وللتمنّي، وللفرضية مع si. يتكوّن من جذر المستقبل + نهايات imparfait: ais، ais، ait، ions، iez، aient. وفي الجملة الشرطية: si + imparfait، ثم الشرطي: Si j’avais de l’argent, je voyagerais.",r:[["Je voudrais un café, s’il vous plaît.","أريد قهوة من فضلك."],["Tu devrais te reposer.","يجب عليك أن ترتاح (نصيحة)."],["Pourriez-vous m’aider ?","هل يمكنكم مساعدتي؟"],["J’aimerais visiter le Japon.","أودّ زيارة اليابان."],["Si j’étais riche, j’achèterais une maison.","لو كنت غنيًا لاشتريت بيتًا."]],tip:"لا تضع الشرطي بعد si مباشرة. الصحيح: si j’avais… وليس si j’aurais…"},
 {lvl:"B1",t:"Les phrases avec si — الجمل الشرطية",d:"هناك نوعان أساسيان في B1. الشرط الممكن: si + الحاضر، ثم الحاضر أو المستقبل أو الأمر: S’il pleut, je reste. والشرط غير المحتمل أو الخيالي: si + imparfait، ثم الشرطي: S’il pleuvait, je resterais. وبعد si لا نستعمل أبدًا المستقبل ولا الشرطي.",r:[["Si tu viens, je serai content.","إذا جئت سأكون مسرورًا."],["S’il fait beau, on va à la plage.","إذا كان الطقس جميلًا نذهب إلى الشاطئ."],["Si tu as faim, mange !","إذا كنت جائعًا فكُل!"],["Si j’avais le temps, je t’aiderais.","لو كان لدي وقت لساعدتك."],["Si j’étais toi, je partirais.","لو كنت مكانك لغادرت."]],tip:"si + il = s’il، لكن si + elle تبقى si elle."},
 {lvl:"B1",t:"Passé composé ou imparfait ? — أي ماضٍ نستعمل؟",d:"في الحكاية نستعمل الصيغتين معًا. passé composé للأحداث التي وقعت وانتهت، وتدفع القصة إلى الأمام (ثم حدث…). و imparfait للوصف والخلفية والحالة والعادات (كان…). وعندما يقطع حدثٌ حالةً مستمرةً: الحالة بـ imparfait والحدث بـ passé composé.",r:[["Il pleuvait quand je suis sorti.","كانت تمطر عندما خرجت."],["Je regardais la télé et le téléphone a sonné.","كنت أشاهد التلفاز فرنّ الهاتف."],["Quand j’étais enfant, je jouais au foot.","عندما كنت طفلًا كنت ألعب كرة القدم."],["Hier, j’ai joué au foot.","أمس لعبت كرة القدم."],["Il faisait beau, alors nous sommes allés à la plage.","كان الطقس جميلًا، فذهبنا إلى الشاطئ."]],tip:"كلمات مثل souvent و tous les jours و d’habitude تقود غالبًا إلى imparfait، وكلمات مثل hier و soudain و une fois تقود إلى passé composé."},
 {lvl:"B1",t:"Le plus-que-parfait — الماضي البعيد",d:"نستعمل plus-que-parfait لحدث وقع قبل حدث آخر في الماضي (ماضي الماضي). يتكوّن من avoir أو être في imparfait + اسم المفعول: j’avais mangé، elle était partie. وتبقى قواعد اختيار avoir أو être نفسها كما في passé composé.",r:[["Quand je suis arrivé, le film avait commencé.","عندما وصلت كان الفيلم قد بدأ."],["Elle était déjà partie.","كانت قد غادرت من قبل."],["J’avais oublié mes clés.","كنت قد نسيت مفاتيحي."],["Il m’a dit qu’il avait fini.","قال لي إنه كان قد أنهى."],["Nous n’avions jamais vu la mer.","لم نكن قد رأينا البحر أبدًا."]],tip:"ضع الأحداث على خط زمني: الأقدم بـ plus-que-parfait، والذي بعده بـ passé composé."},
 {lvl:"B1",t:"Qui, Que, Où — أسماء الموصول",d:"أسماء الموصول تربط جملتين وتتجنّب التكرار. qui تقوم مقام الفاعل ويأتي بعدها فعل غالبًا: l’homme qui parle. و que تقوم مقام المفعول ويأتي بعدها فاعل: le livre que je lis. و où تدل على المكان أو الزمان: la ville où j’habite، le jour où je suis né.",r:[["C’est l’homme qui habite ici.","هذا هو الرجل الذي يسكن هنا."],["Le livre que je lis est intéressant.","الكتاب الذي أقرؤه مثير للاهتمام."],["La ville où j’habite est calme.","المدينة التي أسكن فيها هادئة."],["Le jour où je suis arrivé, il pleuvait.","في اليوم الذي وصلت فيه كانت تمطر."],["C’est le film qu’on a vu hier.","هذا هو الفيلم الذي شاهدناه أمس."]],tip:"قبل حرف علة تصبح que هي qu’، أما qui فلا تتغيّر أبدًا: l’ami qui arrive."},
 {lvl:"B1",t:"Dont — اسم الموصول dont",d:"dont تعوّض اسمًا مسبوقًا بـ de. نستعملها مع الأفعال والعبارات التي تأخذ de، مثل parler de، avoir besoin de، avoir peur de، être fier de، rêver de، وأيضًا للملكية بمعنى «الذي … له».",r:[["Le livre dont je parle est célèbre.","الكتاب الذي أتحدث عنه مشهور."],["C’est l’outil dont j’ai besoin.","إنها الأداة التي أحتاجها."],["Le chien dont j’ai peur est grand.","الكلب الذي أخاف منه كبير."],["C’est un ami dont je suis fier.","إنه صديق أفتخر به."],["Une femme dont le fils est médecin.","امرأة ابنُها طبيب."]],tip:"اسأل: هل الفعل يحتاج de؟ إذا كان الجواب نعم فاستعمل dont: parler de quelque chose ← la chose dont je parle."},
 {lvl:"B1",t:"Y et En — الضميران y و en",d:"y تعوّض مكانًا أو شيئًا يأتي بعد à: Tu vas à Rabat ? — Oui, j’y vais. و en تعوّض اسمًا يأتي بعد de، أو كمية: Tu veux du thé ? — Oui, j’en veux. ومع الأعداد نضيف العدد في آخر الجملة: J’en ai deux.",r:[["Tu vas au marché ? — Oui, j’y vais.","هل تذهب إلى السوق؟ — نعم، أذهب إليه."],["Je pense à mon examen. → J’y pense.","أفكر في امتحاني ← أفكر فيه."],["Tu as des frères ? — Oui, j’en ai deux.","هل لديك إخوة؟ — نعم، لدي اثنان."],["Tu veux de l’eau ? — Non, je n’en veux pas.","هل تريد ماءً؟ — لا، لا أريد."],["Il y a du pain ? — Oui, il y en a.","هل يوجد خبز؟ — نعم، يوجد."]],tip:"يوضع y و en قبل الفعل، مثل الضمائر الأخرى: je n’y vais pas، j’en ai mangé."},
 {lvl:"B1",t:"Les doubles pronoms — ترتيب الضميرين",d:"عندما يجتمع ضميران قبل الفعل نتبع ترتيبًا ثابتًا: me / te / se / nous / vous أولًا، ثم le / la / les، ثم lui / leur، ثم y، ثم en. مثال: il me le donne، je le lui donne، je leur en parle.",r:[["Il me le donne.","يعطيني إيّاه."],["Je le lui donne.","أعطيه إيّاه."],["Tu me la prêtes ?","هل تعيرني إيّاها؟"],["Je vous en parle demain.","سأحدّثكم عنه غدًا."],["Il y en a beaucoup.","هناك الكثير منه."]],tip:"احفظ الترتيب كجملة: me te se nous vous ← le la les ← lui leur ← y ← en."},
 {lvl:"B1",t:"Celui, Celle, Ceux — ضمائر الإشارة",d:"لتجنّب تكرار اسم نستعمل ضمائر الإشارة: celui (مذكر)، celle (مؤنث)، ceux (جمع مذكر)، celles (جمع مؤنث). يأتي بعدها غالبًا qui أو que أو de أو ‑ci / ‑là: celui-ci (هذا)، celui-là (ذاك).",r:[["Quel livre ? — Celui-ci.","أي كتاب؟ — هذا."],["Ma voiture et celle de mon frère.","سيارتي وسيارة أخي."],["Celui qui parle est mon oncle.","الذي يتكلم هو عمي."],["Ces chaussures ou celles-là ?","هذا الحذاء أم ذاك؟"],["Ceux qui veulent peuvent venir.","الذين يريدون يمكنهم المجيء."]],tip:"ci للأقرب و là للأبعد: celle-ci (هذه) / celle-là (تلك)."},
 {lvl:"B1",t:"Le mien, Le tien — ضمائر الملكية",d:"ضمائر الملكية تعوّض الاسم كاملًا مع أداة الملكية: mon livre ← le mien. وتتبع الاسم المملوك في الجنس والعدد: le mien، la mienne، les miens، les miennes. وكذلك: le tien، le sien، le nôtre، le vôtre، le leur.",r:[["Ce livre est le mien.","هذا الكتاب لي."],["Ta voiture est rouge, la mienne est bleue.","سيارتك حمراء وسيارتي زرقاء."],["Ce sont les tiens ?","هل هذه لك؟"],["Notre maison est plus grande que la leur.","بيتنا أكبر من بيتهم."],["C’est le sien.","هذا له / لها."]],tip:"أداة le / la هنا تندمج مع à و de: Je pense au mien (= à le mien)."},
 {lvl:"B1",t:"Le discours indirect — الكلام المنقول",d:"لنقل كلام شخص نستعمل فعلًا مثل dire أو demander أو répondre ثم que. نغيّر الضمائر حسب المعنى. وإذا كان فعل النقل في الماضي تتغيّر الأزمنة: الحاضر ← imparfait، و passé composé ← plus-que-parfait، والمستقبل ← الشرطي. وللسؤال نستعمل si أو كلمة الاستفهام.",r:[["Il dit : « Je suis fatigué. » → Il dit qu’il est fatigué.","يقول إنه متعب."],["Il a dit qu’il était fatigué.","قال إنه كان متعبًا."],["Elle a dit qu’elle viendrait.","قالت إنها ستأتي."],["Il me demande si je viens.","يسألني هل سآتي."],["Je lui ai demandé où il habitait.","سألته أين يسكن."]],tip:"في السؤال المنقول لا نستعمل est-ce que ولا علامة استفهام: il demande où tu vas."},
 {lvl:"B1",t:"Le gérondif — صيغة en + ant",d:"الـ gérondif يعبّر عن فعلين يحدثان في نفس الوقت، أو عن الطريقة أو الشرط. يتكوّن من en + جذر nous في الحاضر + ant: nous parlons ← en parlant. وفاعل الفعلين يجب أن يكون نفسه. الصيغ الشاذة: être ← en étant، avoir ← en ayant، savoir ← en sachant.",r:[["Je mange en regardant la télé.","آكل وأنا أشاهد التلفاز."],["Il chante en travaillant.","يغني وهو يعمل."],["En travaillant beaucoup, tu vas réussir.","بالعمل الجاد ستنجح."],["Je l’ai rencontré en sortant.","التقيته وأنا خارج."],["On apprend en écoutant.","نتعلّم بالاستماع."]],tip:"إذا أردت التأكيد على أن الأمرين في نفس اللحظة أضف tout: Il parle tout en conduisant."},
 {lvl:"B1",t:"Les connecteurs logiques — أدوات الربط المنطقية",d:"في الكتابة والنقاش نحتاج إلى أدوات ربط أدق. للمعارضة: cependant، pourtant، par contre، en revanche (لكن، ومع ذلك). للسبب: car، puisque، grâce à، à cause de. للنتيجة: donc، c’est pourquoi، par conséquent. وللإضافة: de plus، en plus، d’ailleurs. وللتأكيد: en effet.",r:[["Il est fatigué, pourtant il continue.","هو متعب، ومع ذلك يواصل."],["C’est cher, cependant la qualité est bonne.","إنه غالٍ، لكن الجودة جيدة."],["Je reste ici car il pleut.","أبقى هنا لأنها تمطر."],["Il était malade, c’est pourquoi il est absent.","كان مريضًا، لذلك هو غائب."],["De plus, le transport est gratuit.","علاوة على ذلك، النقل مجاني."],["En effet, tu as raison.","فعلًا، أنت محق."]],tip:"grâce à للسبب الإيجابي (بفضل)، و à cause de للسبب السلبي (بسبب): grâce à toi ≠ à cause de la pluie."},
 {lvl:"B1",t:"Le subjonctif présent — صيغة الشك والضرورة",d:"يُستعمل subjonctif بعد التعبير عن الضرورة (il faut que)، والرغبة (je veux que)، والشعور (je suis content que)، والشك، وبعد بعض أدوات الربط مثل bien que و pour que و avant que. نأخذ جذر ils في الحاضر ونضيف: e، es، e، ions، iez، ent. وبعض الأفعال شاذة: être ← que je sois، avoir ← que j’aie، faire ← que je fasse، aller ← que j’aille.",r:[["Il faut que tu viennes.","يجب أن تأتي."],["Je veux que tu sois heureux.","أريد أن تكون سعيدًا."],["Je suis content que tu sois là.","أنا مسرور لأنك هنا."],["Bien qu’il pleuve, je sors.","رغم أنها تمطر سأخرج."],["Je parle lentement pour que tu comprennes.","أتكلم ببطء لكي تفهم."]],tip:"إذا كان الفاعل نفسه في الجملتين نستعمل المصدر وليس subjonctif: je veux partir، وليس je veux que je parte."},
 {lvl:"B1",t:"Exprimer son opinion — التعبير عن الرأي",d:"للتعبير عن الرأي نستعمل عبارات مثل je pense que، je crois que، je trouve que، à mon avis، selon moi، d’après moi. وللموافقة: je suis d’accord، tu as raison. وللمعارضة: je ne suis pas d’accord، je ne pense pas que (ويأتي بعدها subjonctif).",r:[["Je pense que c’est une bonne idée.","أظن أنها فكرة جيدة."],["À mon avis, il a tort.","في رأيي هو مخطئ."],["Je trouve que ce film est trop long.","أرى أن هذا الفيلم طويل جدًا."],["Selon moi, l’éducation est essentielle.","حسب رأيي، التعليم أساسي."],["Je suis d’accord avec toi.","أنا موافق معك."],["Je ne pense pas que ce soit vrai.","لا أظن أن هذا صحيح."]],tip:"je pense que في الإثبات يأتي بعدها indicatif، وفي النفي (je ne pense pas que) يأتي بعدها subjonctif."},
 {lvl:"B1",t:"Exprimer le but — التعبير عن الهدف",d:"للتعبير عن الهدف نستعمل pour أو afin de + مصدر إذا كان الفاعل نفسه: Je travaille pour gagner de l’argent. وإذا تغيّر الفاعل نستعمل pour que أو afin que + subjonctif: Je parle lentement pour que tu comprennes. ولتجنّب شيء: pour ne pas، de peur de.",r:[["J’étudie pour réussir.","أدرس لكي أنجح."],["Il économise afin d’acheter une voiture.","يدّخر من أجل شراء سيارة."],["Je t’explique pour que tu comprennes.","أشرح لك لكي تفهم."],["Je pars tôt pour ne pas être en retard.","أغادر باكرًا لكي لا أتأخر."],["Parle fort afin que tout le monde entende.","تكلّم بصوت عالٍ لكي يسمع الجميع."]],tip:"pour + مصدر = نفس الفاعل. pour que + subjonctif = فاعل آخر."},
 {lvl:"B1",t:"La voix passive — المبني للمجهول",d:"نستعمل المبني للمجهول عندما نريد التركيز على من وقع عليه الفعل. يتكوّن من être في الزمن المطلوب + اسم المفعول، ويتبع اسم المفعول الفاعل في الجنس والعدد. ولذكر من قام بالفعل نستعمل par. وفي الكلام اليومي نفضّل غالبًا on: on parle français ici.",r:[["La maison est construite en pierre.","البيت مبني بالحجر."],["Le voleur a été arrêté.","قُبض على اللص."],["La lettre sera envoyée demain.","سترسل الرسالة غدًا."],["Ce livre a été écrit par Victor Hugo.","كُتب هذا الكتاب من طرف فيكتور هوغو."],["On parle français ici.","يُتكلَّم بالفرنسية هنا."]],tip:"زمن الجملة يظهر في فعل être: est construite (حاضر)، a été construite (ماضٍ)، sera construite (مستقبل)."},
 {lvl:"A1",t:"Les accents — العلامات فوق الحروف",d:"في الفرنسية علامات توضع فوق بعض الحروف وتغيّر نطقها أو معناها. é (accent aigu) تُنطق «إي» مغلقة: été. و è و ê تُنطقان «إي» مفتوحة: mère، fête. و à و ù لا تغيّران النطق لكنهما تفرّقان بين كلمتين: a (يملك) و à (إلى)، ou (أو) و où (أين). و ç تُنطق «س» قبل a و o و u: ça، garçon. و ë و ï تعني أن الحرف يُنطق منفصلًا: Noël، naïf.",r:[["été","إيتي — الصيف"],["mère","مير — الأم"],["fête","فيت — الحفلة"],["Il a un livre. / Il va à Rabat.","يملك كتابًا / يذهب إلى الرباط"],["ou / où","أو / أين"],["garçon, ça va","گارسون، سا ڤا"]],tip:"العلامات جزء من الكتابة الصحيحة: فالامتحان فالكتابة خاصها تكون صحيحة."},
 {lvl:"A1",t:"L’élision — حذف حرف العلة",d:"عندما تأتي كلمة قصيرة تنتهي بـ e أو a قبل كلمة تبدأ بحرف علة أو h صامت، نحذف حرف العلة ونضع مكانه فاصلة عليا ’. يحدث هذا مع: le و la ← l’، و je ← j’، و me و te و se ← m’ و t’ و s’، و ne ← n’، و de ← d’، و que ← qu’. و si تصبح s’ قبل il و ils فقط.",r:[["le ami → l’ami","الصديق"],["la école → l’école","المدرسة"],["je aime → j’aime","أحب"],["je ne ai pas → je n’ai pas","ليس لدي"],["parce que il → parce qu’il","لأنه"],["si il pleut → s’il pleut","إذا أمطرت"]],tip:"الحذف إجباري في الفرنسية: لا تكتب أبدًا le ami أو je aime."},
 {lvl:"A1",t:"La liaison — الوصل",d:"أغلب الحروف الأخيرة في الفرنسية لا تُنطق. لكن عندما تأتي بعدها كلمة تبدأ بحرف علة أو h صامت، يُنطق الحرف الأخير ويلتصق بالكلمة التالية. هذا اسمه liaison. الـ s و x تُنطقان «ز»، و t و d تُنطقان «ت»، و n تُنطق «ن». الوصل إجباري بعد الأدوات (les، des، un، mon)، وبعد الضمائر (nous، vous، ils، elles)، وبعد الكلمات القصيرة (très، chez، dans، en).",r:[["les amis","لي زامي"],["des enfants","دي زونفون"],["nous avons","نو زاڤون"],["un ami","أن نامي"],["ils arrivent","إيل زاريڤ"],["très important","تري زامپورتون"]],tip:"الوصل ممنوع بعد et: «un garçon et une fille» نقول «إيه أن» بدون t. وممنوع قبل h aspiré: les héros."},
 {lvl:"A1",t:"L’enchaînement — ربط الكلمات",d:"في الكلام، الحرف الساكن الذي يُنطق في آخر الكلمة يلتصق بحرف العلة في أول الكلمة التالية، فتُسمع الجملة كأنها كلمة واحدة. هذا اسمه enchaînement، وهو يختلف عن liaison لأن الحرف هنا يُنطق دائمًا، حتى وحده. لهذا يبدو الكلام الفرنسي سريعًا ومتصلًا.",r:[["il a","إي لا"],["elle arrive","إي لاريڤ"],["une amie","أو نامي"],["avec elle","آڤي كيل"],["pour aller","پو رالي"],["quatre enfants","كا ترونفون"]],tip:"لفهم الكلام الفرنسي، تعوّد على سماع الجملة كاملة وليس كلمة بكلمة."},
 {lvl:"A1",t:"Les lettres muettes — الحروف التي لا تُنطق",d:"كثير من الحروف الأخيرة في الفرنسية لا تُنطق: s و t و d و x و z و p غالبًا صامتة: petit، grand، deux، beaucoup. و e في آخر الكلمة لا تُنطق: table، homme. ونهاية الفعل ent في الجمع لا تُنطق أيضًا: ils parlent. أما c و r و f و l فتُنطق غالبًا في آخر الكلمة (تذكّر كلمة careful): sac، mer، neuf، sel.",r:[["petit","پوتي — صغير"],["grand","گرون — كبير"],["deux","دو — اثنان"],["ils parlent","إيل پارل — يتكلمون"],["le sac","لو ساك — الحقيبة"],["la mer","لا مير — البحر"]],tip:"قاعدة careful ليست مطلقة: r لا تُنطق في نهاية أفعال er (parler ← پارلي)."},

 {lvl:"A1",t:"Les sons u, ou, eu — أصوات العلة الخاصة",d:"بعض أصوات العلة الفرنسية لا توجد في العربية. ou تُنطق «و» عادية: vous، tout. أما u فصوت بين «و» و«ي»: قل «ي» ثم ضمّ شفتيك كأنك ستقول «و»: tu، rue. و eu و œu تُنطق مثل «و» مع شفتين مستديرتين وفم أكثر انفتاحًا: deux، sœur. و oi تُنطق «وا»: moi، trois.",r:[["vous / vu","ڤو / ڤو(ي) — أنتم / رأى"],["tout / tu","تو / تو(ي) — كل / أنت"],["la rue / la roue","لا رو(ي) / لا رو — الشارع / العجلة"],["deux","دو — اثنان"],["la sœur","لا سور — الأخت"],["moi, trois","موا، تروا — أنا، ثلاثة"]],tip:"تمرّن على الفرق بين tu و tout: الفرق في الشفتين فقط، ويغيّر المعنى."},

var ALL="الكل",GOAL=10,XP_LEVEL=200;

function parse(lang){
 var cat="",lvl="A1",out=[];
 RAW[lang].split("\n").forEach(function(line){
  line=line.trim();if(!line)return;
  if(line.charAt(0)==="#"){var h=line.slice(1).split("|");if(h.length>1){lvl=h[0];cat=h[1]}else{lvl="A1";cat=h[0]}return}
  var p=line.split("|");
  out.push({id:lang==="fr"?p[0]:"de:"+p[0],cat:cat,lvl:lvl,w:p[0],g:p[1]||"",da:p[2],pr:p[3],ex:p[4],exd:p[5]}); /* da = Arabic meaning, exd = Arabic example */
 });
 return out;
}
var DB={fr:parse("fr"),de:parse("de")};
var CEFR=["A1","A2","B1","B2"];
function cats(lang,lv){return[ALL].concat(DB[lang].filter(function(e){return lv===ALL||e.lvl===lv}).map(function(e){return e.cat}).filter(function(v,i,a){return a.indexOf(v)===i}))}
function lvlStats(lang,lv){var list=DB[lang].filter(function(e){return e.lvl===lv}),k=list.filter(function(e){return ST[lang].learned[e.id]}).length;return{k:k,n:list.length}}
/* Vocabulary targets are cumulative: reaching A2 means about 1,200 mastered words in total (A1 + A2). */
var TARGETS={A1:600,A2:1200,B1:2200,B2:3800};
function vocab(lang){
 var p=ST[lang],own={},av={},cm=0,ca=0;CEFR.forEach(function(l){own[l]=0;av[l]=0});
 DB[lang].forEach(function(e){av[e.lvl]++;if(p.mastered[e.id])own[e.lvl]++});
 return CEFR.map(function(l){cm+=own[l];ca+=av[l];var t=TARGETS[l];return{l:l,t:t,m:cm,own:own[l],avail:ca,rem:Math.max(0,t-cm),pct:pctTxt(cm,t),w:Math.min(100,cm/t*100)}});
}
function masteredCount(lang){var n=0,m=ST[lang].mastered;DB[lang].forEach(function(e){if(m[e.id])n++});return n}
function pctTxt(a,b){var v=Math.round(a/b*1000)/10;return(v%1===0?v.toFixed(0):v.toFixed(1))+"%"}
function fmtN(n){return Number(n).toLocaleString("en-US")}
/* A word is mastered only when answered correctly in a quiz. Returns true the first time only. */
function master(id){var p=P();if(p.mastered[id])return false;p.mastered[id]=Date.now();return true}
function curLevel(lang){for(var i=0;i<CEFR.length;i++){var s=lvlStats(lang,CEFR[i]);if(s.k<s.n*.8)return CEFR[i]}return"B2"}

/* =========================================================
   2. STORE — التقدّم محفوظ فالجهاز، ومتزامن مع الحساب ديالك
   Shape is plain JSON, ready for Firebase/Firestore:
   { v, nick, fr:{learned,stats,xp,days,quizzes,lessons}, de:{…} }
   ========================================================= */
var KEY="lingo:v2";
function blank(){return{learned:{},mastered:{},stats:{},xp:0,days:{},quizzes:[],lessons:{},exams:{}}}
function fix(p){p=p&&typeof p==="object"?p:{};var hadM=!!(p.mastered&&typeof p.mastered==="object"&&!Array.isArray(p.mastered));var b=blank();Object.keys(b).forEach(function(k){if(p[k]==null||typeof p[k]!==typeof b[k]||Array.isArray(p[k])!==Array.isArray(b[k]))p[k]=b[k]});
 /* First load after this feature: rebuild mastery from real quiz history only (a word answered correctly at least once). Nothing else is assumed. */
 if(!hadM)Object.keys(p.stats).forEach(function(k){var st=p.stats[k];if(st&&st[0]>0)p.mastered[k]=1});
 return p}
var ST={v:2,nick:"",fr:blank(),de:blank()};

var Store={
 key:KEY,
 read:function(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}},
 apply:function(s){ST.nick=(s&&s.nick)||"";ST.fr=fix(s&&s.fr);ST.de=fix(s&&s.de)},
 /* Each signed-in account keeps its own copy on this device ("lingo:u:<id>").
    Progress made before signing in is handed to the first account that signs in here, once. */
 useAccount:function(uid){
  var k="lingo:u:"+uid,s=Store.read(k);
  if(!s){var claimed=null;try{claimed=localStorage.getItem("lingo:claimed")}catch(e){}
   if(!claimed){s=JSON.parse(JSON.stringify(ST));try{localStorage.setItem("lingo:claimed",uid)}catch(e){}}
   else s={nick:"",fr:blank(),de:blank()};}
  Store.key=k;Store.apply(s);Store.save(true);
 },
 load:function(){
  var s=Store.read(KEY);
  if(s){Store.apply(s);return}
  // Migration from the first version: keep every word already learned (date unknown, so it never counts as "today")
  try{var old=JSON.parse(localStorage.getItem("fr-game")||"null");
   if(old&&old.learned){Object.keys(old.learned).forEach(function(k){ST.fr.learned[k]=1});ST.fr.xp=Object.keys(old.learned).length*10;ST.nick=old.nick||""}
  }catch(e){}
  Store.save(true);
 },
 save:function(silent){
  try{localStorage.setItem(Store.key,JSON.stringify(ST))}catch(e){}
  if(!silent)Cloud.push();
 }
};

function mergeLang(a,b){
 a=fix(a);b=fix(b);var o=blank();
 [a,b].forEach(function(p){Object.keys(p.learned).forEach(function(k){var v=p.learned[k];o.learned[k]=o.learned[k]?Math.max(o.learned[k],v):v})});
 [a,b].forEach(function(p){Object.keys(p.stats).forEach(function(k){var s=p.stats[k]||[0,0],c=o.stats[k]||[0,0];o.stats[k]=[Math.max(c[0],s[0]),Math.max(c[1],s[1])]})});
 [a,b].forEach(function(p){Object.keys(p.mastered).forEach(function(k){var v=p.mastered[k];o.mastered[k]=o.mastered[k]?Math.min(o.mastered[k],v):v})});
 o.xp=Math.max(a.xp,b.xp);
 [a,b].forEach(function(p){Object.keys(p.days).forEach(function(k){var d=p.days[k],c=o.days[k]||{n:0,xp:0,q:0};o.days[k]={n:Math.max(c.n,d.n||0),xp:Math.max(c.xp,d.xp||0),q:Math.max(c.q,d.q||0)}})});
