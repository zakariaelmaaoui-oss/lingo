<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>تعلّم الفرنسية والألمانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: welcome picker -> app shell (bottom tab bar on phones, side rail on desktop); soft white surfaces, one blue→violet gradient reserved for progress and primary actions */
:root{
 color-scheme:light;
 --bg:#FFFFFF;--panel:#F5F6FB;--surface:#FFFFFF;--ink:#151833;--muted:#6C7192;--faint:#A3A8C3;--line:#E8EAF3;
 --blue:#5470F5;--violet:#8C6CF0;--soft:#EEF1FE;--vsoft:#F3EFFE;
 --grad:linear-gradient(120deg,#5B7BFA 0%,#8C6CF0 100%);
 --ok:#1C9C68;--ok-soft:#E5F6EE;--bad:#E04A55;--bad-soft:#FDECEE;--warm:#F59E0B;
 --gm:#2F6BFF;--gf:#E0458B;--gn:#16A066;
 --f:"Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
 --r:20px;--r-sm:14px;
 --shadow:0 1px 2px rgba(21,24,51,.04),0 8px 24px rgba(21,24,51,.06);
 --shadow-lg:0 2px 4px rgba(21,24,51,.04),0 18px 40px rgba(84,112,245,.14);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.fw{direction:ltr;unicode-bidi:isolate;font-weight:700;letter-spacing:-.01em}
.art{font-weight:800}
.g-m{color:var(--gm)}.g-f{color:var(--gf)}.g-n{color:var(--gn)}
mark{background:none;font-weight:700;color:var(--blue)}
mark.g-m{color:var(--gm)}mark.g-f{color:var(--gf)}mark.g-n{color:var(--gn)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.enter{animation:rise .32s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- flags ---------- */
.flag{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(21,24,51,.08)}
.flag.fr{background:linear-gradient(90deg,#2050D6 0 33.4%,#fff 33.4% 66.6%,#E5384A 66.6%)}
.flag.de{background:linear-gradient(180deg,#1B1B1F 0 33.4%,#DD2C2C 33.4% 66.6%,#F5C232 66.6%)}
.flag.sm{width:26px;height:26px}
.flag.lg{width:64px;height:64px}

/* ---------- welcome ---------- */
#welcome{min-height:100%;position:relative;overflow:hidden}
#welcome::before{content:"";position:absolute;inset:-180px -120px auto auto;width:460px;height:460px;border-radius:50%;background:radial-gradient(closest-side,rgba(140,108,240,.16),transparent);pointer-events:none}
#welcome::after{content:"";position:absolute;inset:auto auto -200px -140px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(84,112,245,.12),transparent);pointer-events:none}
.wel{position:relative;max-width:980px;margin:0 auto;padding-block:40px 56px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand .dot{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff}
.brand .dot .ico{width:18px;height:18px}
.wel-hero{display:flex;flex-direction:column;gap:10px;max-width:560px}
.wel-hero h1{font-size:clamp(2rem,6.5vw,3rem);font-weight:700;letter-spacing:-.02em}
.wel-hero p{font-size:1.05rem;color:var(--muted)}
.langs{display:grid;gap:16px}
@media (min-width:720px){.langs{grid-template-columns:1fr 1fr}}
.lang{position:relative;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.lang:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#D6DBF6}
.lang-top{display:flex;align-items:center;gap:14px}
.lang-top h2{font-size:1.5rem;font-weight:700}
.lang-top .fw{display:block;font-size:.95rem;font-weight:500;color:var(--muted)}
.lvl-pill{margin-inline-start:auto;font-size:.78rem;font-weight:700;color:var(--blue);background:var(--soft);padding:4px 10px;border-radius:99px;direction:ltr}
.feat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:.92rem}
.feat li{display:flex;align-items:center;gap:8px;color:#3B4064}
.feat .ico{width:16px;height:16px;color:var(--violet);stroke-width:2.4}
.lang-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.lang-stats{display:flex;flex-wrap:wrap;gap:14px;font-size:.88rem;color:var(--muted)}
.lang-stats b{color:var(--ink);font-weight:700}
.go{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;transition:transform .25s}
.lang:hover .go{transform:translateX(-4px)}
.wel-note{font-size:.85rem;color:var(--faint)}

/* ---------- app shell ---------- */
#app{min-height:100%}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
 padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-brand{display:none}
.nav-items{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.72rem;font-weight:600;color:var(--faint);transition:color .2s}
.nav-btn .ico{width:22px;height:22px}
.nav-btn[aria-current="page"]{color:var(--blue)}
.main{max-width:1080px;margin:0 auto;padding-block:14px 110px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.switch{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:600;font-size:.9rem;transition:border-color .2s,box-shadow .2s}
.switch:hover{border-color:#D3D8F4;box-shadow:var(--shadow)}
.switch .ico{width:16px;height:16px;color:var(--muted)}
.pills{margin-inline-start:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--panel);font-weight:700;font-size:.88rem}
.pill.xp{color:var(--violet);background:var(--vsoft);direction:ltr}
.pill.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}
@media (min-width:900px){
 #app{display:grid;grid-template-columns:240px 1fr}
 .nav{position:sticky;top:0;inset:auto;height:100vh;border-top:0;border-inline-end:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:24px;background:var(--bg)}
 .nav-brand{display:flex}
 .nav-items{display:flex;flex-direction:column;gap:4px;max-width:none;margin:0}
 .nav-btn{flex-direction:row;gap:12px;padding:11px 14px;font-size:.95rem;color:var(--muted)}
 .nav-btn:hover{background:var(--panel);color:var(--ink)}
 .nav-btn[aria-current="page"]{background:var(--soft);color:var(--blue)}
 .main{padding-block:28px 64px;padding-left:40px;padding-right:40px;width:100%}
}

/* ---------- shared bits ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h1{font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
.sec{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:22px 0 10px}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r-sm);font-weight:700;border:1px solid var(--line);background:var(--surface);transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{border-color:#D3D8F4;box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(110,100,240,.25)}
.btn.pri:hover{box-shadow:0 10px 26px rgba(110,100,240,.34)}
.btn.ghost{border-color:transparent;background:var(--panel)}
.btn.done,.btn:disabled{cursor:default;background:var(--ok-soft);border-color:transparent;color:var(--ok);box-shadow:none}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btn.block{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .2s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.gtag{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--panel)}
.gtag.g-m{background:#EAF0FF}.gtag.g-f{background:#FDEAF3}.gtag.g-n{background:#E4F6EE}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.legend b{font-weight:800;direction:ltr}
.empty{text-align:center;padding:40px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ico{width:34px;height:34px;color:var(--faint)}

/* ---------- home ---------- */
.home{display:grid;gap:16px}
@media (min-width:900px){.home{grid-template-columns:1.1fr 1fr;align-items:start;gap:24px}.home-l,.home-r{display:flex;flex-direction:column;gap:16px}}
.home-l,.home-r{display:contents}
@media (min-width:900px){.home-l,.home-r{display:flex}}
.hello p{font-size:1rem;font-weight:500}
.hello h1{font-size:clamp(2rem,8vw,2.7rem);font-weight:800;letter-spacing:-.03em;margin-top:4px}
.hello h1 .fw{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.plan{padding:20px;display:flex;flex-direction:column;gap:14px}
.plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.plan-top h2{font-size:1.15rem;font-weight:700}
.plan-top p{margin-top:2px}
.plan-top p b{color:var(--ink);font-size:1.05rem}
.flame{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:8px 12px;border-radius:16px;background:#FFF5E6}
.flame b{font-size:1.25rem}
.flame span{font-size:.72rem;color:#9A6512;font-weight:600}
.plan-msg{font-size:.9rem;color:var(--muted)}
.plan.won{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border-color:transparent}
.plan.won .plan-msg{color:var(--ok);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:start;padding:16px;display:flex;flex-direction:column;gap:14px;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.tile-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.tile-ic .ico{width:22px;height:22px}
.ic-b{background:var(--soft);color:var(--blue)}.ic-v{background:var(--vsoft);color:var(--violet)}.ic-g{background:#E7F6EF;color:var(--gn)}.ic-o{background:#FFF3E2;color:#D9850B}
.tile .arrow{color:var(--faint)}
.tile h3{font-size:1.02rem;font-weight:700}
.tile p{font-size:.84rem;color:var(--muted)}
.cta{width:100%;padding:16px;font-size:1.02rem}
.word-day{padding:18px;display:flex;flex-direction:column;gap:8px}
.word-day .w{font-size:1.6rem}
.word-day .ex{font-size:.92rem}

/* ---------- words ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid transparent;border-radius:var(--r-sm);padding:0 14px;margin-bottom:12px;transition:border-color .2s,background .2s}
.search:focus-within{border-color:#CBD3FA;background:var(--surface)}
.search .ico{color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--panel);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:.86rem;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(21,24,51,.1)}
.study{display:grid;gap:14px;margin-top:16px;max-width:620px}
.fcard{position:relative;width:100%;min-height:300px;padding:30px 20px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:box-shadow .25s,transform .25s}
.fcard:hover{box-shadow:var(--shadow-lg)}
.fcard.flip{animation:flip .35s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.fcard .tl{position:absolute;top:14px;inset-inline-start:16px;display:flex;gap:6px;align-items:center}
.fcard .tr{position:absolute;top:14px;inset-inline-end:16px}
.tag{font-size:.75rem;color:var(--muted);background:var(--panel);padding:2px 10px;border-radius:99px}
.ok-tag{font-size:.75rem;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:2px 10px;border-radius:99px}
.fcard .big{font-size:clamp(2.2rem,10vw,3.2rem);line-height:1.15}
.fcard .pron{font-size:.95rem;color:var(--muted)}
.fcard .hint{font-size:.8rem;color:var(--faint);margin-top:6px}
.fcard .da{font-size:clamp(1.8rem,8vw,2.4rem);font-weight:700}
.fcard .msa{font-size:.92rem;color:var(--muted)}
.exbox{width:100%;margin-top:8px;padding:14px;border-radius:16px;background:var(--panel);text-align:start;display:flex;flex-direction:column;gap:4px}
.exbox .lbl{font-size:.72rem;font-weight:700;color:var(--faint)}
.exbox .exf{direction:ltr;text-align:left;font-weight:500}
.exbox .exd{color:var(--muted);font-size:.92rem}
.stnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:all .2s}
.round:hover{box-shadow:var(--shadow);border-color:#D3D8F4}
.stact{display:grid;grid-template-columns:auto auto 1fr;gap:10px}
.list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
@media (min-width:900px){.list{grid-template-columns:1fr 1fr}}
.wrow{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 6px 4px 4px;transition:border-color .2s,box-shadow .2s}
.wrow:hover{border-color:#D3D8F4;box-shadow:var(--shadow)}
.wrow .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 10px;text-align:start}
.gdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.gdot.g-m{background:var(--gm)}.gdot.g-f{background:var(--gf)}.gdot.g-n{background:var(--gn)}
.wrow .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.wrow .t .fw{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .t small{color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .chk{color:var(--ok)}
.wrow .spk{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.wrow .spk:hover{background:var(--panel);color:var(--blue)}

/* ---------- quiz ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{text-align:start;padding:14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px;transition:all .2s}
.mode:hover{border-color:#CBD3FA}
.mode[aria-pressed="true"]{border-color:var(--blue);background:var(--soft);box-shadow:0 0 0 3px rgba(84,112,245,.12)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.mode b{font-size:.95rem}
.mode small{color:var(--muted);font-size:.8rem;line-height:1.4}
.qset{display:flex;flex-direction:column;max-width:760px}
.sel{width:100%;padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface)}
.lvl-d{font-size:.84rem;color:var(--muted);margin-top:8px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--panel);font-size:.9rem}
.hist li .s{margin-inline-start:auto;font-weight:700}
.play{max-width:640px;display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .bar{flex:1}
.x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--panel)}
.qcard{padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.qcard .big{font-size:clamp(2rem,9vw,2.8rem);line-height:1.15}
.qcard .da{font-size:clamp(1.7rem,7vw,2.2rem);font-weight:700}
.qcard .ask{color:var(--muted);font-size:.92rem}
.qcard .hintw{direction:ltr;letter-spacing:.3em;color:var(--faint);font-weight:700;margin-top:4px}
.listen{width:96px;height:96px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(110,100,240,.32);position:relative;transition:transform .15s}
.listen:active{transform:scale(.95)}
.listen .ico{width:36px;height:36px}
.listen::before,.listen::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(140,108,240,.28)}
.listen::after{inset:-20px;border-color:rgba(140,108,240,.14)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.c3{grid-template-columns:1fr}
@media (min-width:520px){.opts.c3{grid-template-columns:repeat(3,1fr)}}
.opt{padding:15px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-weight:600;min-width:0;text-align:center;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.55}
.wbox{display:flex;gap:10px}
.wbox input{flex:1;min-width:0;direction:ltr;text-align:left;padding:14px 16px;border-radius:var(--r-sm);border:1.5px solid var(--line);font-size:1.1rem;font-weight:600;outline:none;background:var(--surface)}
.wbox input:focus{border-color:var(--blue)}
.wbox input.ok{border-color:var(--ok);background:var(--ok-soft)}

/* Turns Firebase into the same small interface the app already uses (claude.use("user") / claude.use("db")). */
(function(){
 if(!window.FIREBASE_CONFIG||typeof firebase==="undefined"||window.claude)return;
 try{firebase.initializeApp(window.FIREBASE_CONFIG)}catch(e){console.error("Firebase config error",e);return}
 var auth=firebase.auth(),fs=firebase.firestore();
 var ready=new Promise(function(res){var un=auth.onAuthStateChanged(function(u){un();res(u)})});
 var user={me:function(){return ready.then(function(u){return u?{id:u.uid,name:u.displayName||""}:{id:null,name:""}})},can:function(){return true}};
 window.claude={use:function(n){return ready.then(function(u){return n==="user"?user:n==="db"?(u?fs:null):null})}};
 var provider=new firebase.auth.GoogleAuthProvider();
 window.LINGO_AUTH={
  signIn:function(){return auth.signInWithPopup(provider).catch(function(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))return auth.signInWithRedirect(provider);throw e}).then(function(){location.reload()})},
  signOut:function(){return auth.signOut().then(function(){location.reload()})}
 };
})();

function parse(lang){
 var cat="",lvl="A1",out=[];
 RAW[lang].split("\n").forEach(function(line){
  line=line.trim();if(!line)return;
  if(line.charAt(0)==="#"){var h=line.slice(1).split("|");if(h.length>1){lvl=h[0];cat=h[1]}else{lvl="A1";cat=h[0]}return}
  var p=line.split("|");
  out.push({id:lang==="fr"?p[0]:"de:"+p[0],cat:cat,lvl:lvl,w:p[0],g:p[1]||"",da:p[2],pr:p[3],ex:p[4],exd:p[5]}); /* da = Arabic meaning, exd = Arabic example */
 });
 return out;
}

function lvlStats(lang,lv){var list=DB[lang].filter(function(e){return e.lvl===lv}),k=list.filter(function(e){return ST[lang].learned[e.id]}).length;return{k:k,n:list.length}}
/* Vocabulary targets are cumulative: reaching A2 means about 1,200 mastered words in total (A1 + A2). */
var TARGETS={A1:600,A2:1200,B1:2200,B2:3800};
function vocab(lang){
 var p=ST[lang],own={},av={},cm=0,ca=0;CEFR.forEach(function(l){own[l]=0;av[l]=0});

}

var KEY="lingo:v2";
function blank(){return{learned:{},mastered:{},stats:{},xp:0,days:{},quizzes:[],lessons:{}}}
function fix(p){p=p&&typeof p==="object"?p:{};var hadM=!!(p.mastered&&typeof p.mastered==="object"&&!Array.isArray(p.mastered));var b=blank();Object.keys(b).forEach(function(k){if(p[k]==null||typeof p[k]!==typeof b[k]||Array.isArray(p[k])!==Array.isArray(b[k]))p[k]=b[k]});
 /* First load after this feature: rebuild mastery from real quiz history only (a word answered correctly at least once). Nothing else is assumed. */
 if(!hadM)Object.keys(p.stats).forEach(function(k){var st=p.stats[k];if(st&&st[0]>0)p.mastered[k]=1});
 return p}
var ST={v:2,nick:"",fr:blank(),de:blank()};

function mergeLang(a,b){
 a=fix(a);b=fix(b);var o=blank();
 [a,b].forEach(function(p){Object.keys(p.learned).forEach(function(k){var v=p.learned[k];o.learned[k]=o.learned[k]?Math.max(o.learned[k],v):v})});
 [a,b].forEach(function(p){Object.keys(p.stats).forEach(function(k){var s=p.stats[k]||[0,0],c=o.stats[k]||[0,0];o.stats[k]=[Math.max(c[0],s[0]),Math.max(c[1],s[1])]})});
 [a,b].forEach(function(p){Object.keys(p.mastered).forEach(function(k){var v=p.mastered[k];o.mastered[k]=o.mastered[k]?Math.min(o.mastered[k],v):v})});
 o.xp=Math.max(a.xp,b.xp);
 [a,b].forEach(function(p){Object.keys(p.days).forEach(function(k){var d=p.days[k],c=o.days[k]||{n:0,xp:0,q:0};o.days[k]={n:Math.max(c.n,d.n||0),xp:Math.max(c.xp,d.xp||0),q:Math.max(c.q,d.q||0)}})});
 var seen={};o.quizzes=a.quizzes.concat(b.quizzes).filter(function(q){if(!q||seen[q.t])return false;seen[q.t]=1;return true}).sort(function(x,y){return x.t-y.t}).slice(-50);
 [a,b].forEach(function(p){Object.keys(p.lessons).forEach(function(k){o.lessons[k]=1})});
 return o;
}

/* Cloud: per-user private progress + shared leaderboard (artifact db) */
/* Hosting: on claude.ai the platform gives sign-in + db; on your own site (Vercel) the Firebase adapter
   in the page head provides the same window.claude.use("user"|"db") shape, plus window.LINGO_AUTH for Google sign-in. */
var FB=!!(window.LINGO_AUTH||window.LINGO_SITE), PLAT=FB?"Google":"claude.ai";
/* Account = the viewer's own sign-in. status: checking | signed | guest ; sync: ok | saving | local | readonly | error */
var Acc={status:"checking",uid:null,name:"",sync:"local",last:0};
var Cloud={db:null,uid:null,timer:null,subs:{},boards:{fr:null,de:null},fail:false,
 init:function(){
  var guest=function(){Acc.status="guest";Acc.sync="local";refresh()};
  if(!window.claude||!window.claude.use){guest();return}
  Promise.all([claude.use("user"),claude.use("db")]).then(function(r){
   var user=r[0],db=r[1];
   if(!user){guest();return}
   return user.me().then(function(me){
    if(!me||!me.id){guest();return}
    Acc.status="signed";Acc.uid=me.id;Acc.name=me.name||"";
    Store.useAccount(me.id);
    if(!db){Acc.sync="local";refresh();return}
    Cloud.db=db;Cloud.uid=me.id;Acc.sync="saving";refresh();
    var cw;try{cw=Promise.resolve(user.can?user.can("data.write"):null)}catch(e){cw=Promise.resolve(null)}
    return cw.catch(function(){return null}).then(function(can){
     return Cloud.ref().get().then(function(snap){
      if(snap&&snap.exists){var d=snap.data()||{};ST.fr=mergeLang(ST.fr,d.fr);ST.de=mergeLang(ST.de,d.de);if(!ST.nick&&d.nick)ST.nick=d.nick;Store.save(true)}
      Acc.sync=can===false?"readonly":"ok";Acc.last=Date.now();
     }).catch(function(){Acc.sync="error"});
    }).then(function(){refresh();if(Acc.sync!=="readonly")Cloud.push(true);Cloud.score();if(U.lang)Cloud.board(U.lang)});
   });
  }).catch(guest);
 },
 ref:function(){return Cloud.db.collection("data/users/"+Cloud.uid).doc("lingo")},
 push:function(){

var U={lang:null,view:"home",cefr:ALL,qcefr:ALL,cat:ALL,q:"",wmode:"cards",idx:0,flipped:false,qmode:"a",qlvl:"mid",qcat:ALL,cal:null,lesson:null,resetAsk:false};

function P(){return ST[U.lang]}
function words(){return DB[U.lang]}
function byId(id){var w=words();for(var i=0;i<w.length;i++)if(w[i].id===id)return w[i];return null}
function count(lang){var l=ST[lang].learned,ids={};DB[lang].forEach(function(e){ids[e.id]=1});return Object.keys(l).filter(function(k){return ids[k]}).length}
function pad(n){return(n<10?"0":"")+n}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return dkey(new Date())}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function day(p,k){k=k||today();if(!p.days[k])p.days[k]={n:0,xp:0,q:0};return p.days[k]}
function dayN(p,k){return p.days[k]?p.days[k].n:0}

function streak(lang){
 var p=ST[lang],d=new Date(),cur=0;
 if(dayN(p,dkey(d))<GOAL)d=addDays(d,-1);
 while(dayN(p,dkey(d))>=GOAL){cur++;d=addDays(d,-1)}
 var keys=Object.keys(p.days).filter(function(k){return p.days[k].n>=GOAL}).sort(),best=0,run=0,prev=null;
 keys.forEach(function(k){var t=new Date(k+"T12:00:00");run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1;best=Math.max(best,run);prev=t});
 return{cur:cur,best:Math.max(best,cur),today:dayN(p,today())};
}
function level(xp){return{n:Math.floor(xp/XP_LEVEL)+1,into:xp%XP_LEVEL}}
function accuracy(p){var r=0,w=0;Object.keys(p.stats).forEach(function(k){r+=p.stats[k][0];w+=p.stats[k][1]});return r+w?Math.round(r/(r+w)*100):null}

function addXP(n){var p=P();p.xp+=n;day(p).xp+=n;bump("pxp")}
function learn(id){
 var p=P();if(p.learned[id])return false;
 p.learned[id]=Date.now();var d=day(p);d.n++;addXP(10);
 if(d.n===GOAL){var s=streak(U.lang);toast("برافو! كمّلتي هدف اليوم 🔥 "+s.cur+" "+(s.cur===1?"نهار":"يام")+" متتابعين",true);bump("pstreak")}
 Store.save();return true;
}

function weight(e){var p=P(),s=p.stats[e.id]||[0,0];if(!p.learned[e.id])return 3;if(s[1]>s[0])return 4;if(s[1]>0)return 2;return 1}

 if(U.qmode==="d")pool=pool.filter(writable);

  var seen={};seen[e[key]]=1;var dist=[];
  src.forEach(function(x){if(dist.length<lv.o-1&&!seen[x[key]]){seen[x[key]]=1;dist.push(x)}});
  return{e:e,opts:shuffle(dist.concat([e]))};

 var L=LANG[U.lang],board=Cloud.boards[U.lang],note="",list="";
 if(!Cloud.db)note="الترتيب كيخدم غير إلا كنتي داخل بالحساب ديالك ("+PLAT+"). التقدّم ديالك محفوظ فهاد الجهاز.";
 else if(board===null)note="كنحمّلو الترتيب…";
 else if(!board.length)note="مازال حتى واحد ما تسجّل فـ"+L.name+". حفظ كلمة وكتب سميتك باش تكون الأول.";
 else{
  note=Cloud.fail?(FB?"ما قدرناش نسجّلو النقط ديالك. عاود جرّب من بعد شوية.":"ما قدرناش نسجّلو النقط ديالك. طلب من صاحب الصفحة يعطيك صلاحية Contributor من Share."):(ST.nick?"صيفط الرابط ديال هاد الصفحة لصحابك باش يتنافسو معاك.":"كتب سميتك باش تبان فالترتيب.");
  list='<ol class="card board">'+board.map(function(r,k){return'<li'+(r.id===Cloud.uid?' class="me"':"")+'><span class="r num">'+(k+1)+'</span><span class="n">'+esc(r.name||"مجهول")+(r.id===Cloud.uid?"<small>(نتا)</small>":"")+'</span><span class="s num">'+r.pts+' كلمة</span></li>'}).join("")+'</ol>';
 }
 return'<div class="fr-wrap"><div class="view-head"><h1>الأصحاب</h1><span class="pill"><span class="flag sm '+U.lang+'"></span>'+L.name+'</span></div>'+
  '<form class="nick" id="nickf"><input id="nick" maxlength="16" value="'+esc(ST.nick)+'" placeholder="سميتك فالترتيب" aria-label="سميتك فالترتيب" autocomplete="nickname"><button class="btn pri" type="submit">سجّل</button></form>'+
  list+'<p class="note">'+note+'</p></div>';
}

/* ---------- ACCOUNT ---------- */
function vAccount(){
 var signed=Acc.status==="signed";
 var SY={ok:["ok","التقدّم محفوظ فالحساب ديالك"+(Acc.last?" · آخر حفظ "+new Date(Acc.last).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"")],
  saving:["warn","كنحفظو التقدّم ديالك…"],
  readonly:["warn","عندك غير صلاحية المشاهدة، داكشي علاش التقدّم كيتحفظ غير فهاد الجهاز. طلب من مول الصفحة يعطيك Contributor من Share."],
  error:["bad","ما قدرناش نوصلو للحساب دابا. التقدّم محفوظ فهاد الجهاز وغادي يتحفظ فالحساب ملي يرجع الاتصال."],
  local:["warn","التقدّم محفوظ غير فهاد الجهاز."]};
 var sy=signed?(SY[Acc.sync]||SY.local):["off","ماشي داخل بحساب: التقدّم محفوظ غير فهاد المتصفح."];
 if(Acc.status==="checking")sy=["warn","كنتأكدو من الحساب…"];
 var langs=["fr","de"].map(function(l){var s=streak(l);return'<div class="acc-l"><span class="flag sm '+l+'"></span><b>'+LANG[l].name+'</b><span class="muted">المستوى '+curLevel(l)+'</span><span class="muted"><span class="num">'+count(l)+'</span> كلمة</span><span class="muted"><span class="num">'+masteredCount(l)+'</span> متقنة</span><span class="muted num">'+ST[l].xp+' XP</span><span class="num">🔥 '+s.cur+'</span></div>'}).join("");
 return'<div class="fr-wrap"><div class="view-head"><h1>الحساب ديالي</h1></div>'+
  '<div class="card acc-head"><span class="av lg">'+(initial()||ic("users"))+'</span><div><h2>'+(signed?(Acc.name?esc(Acc.name):"داخل بالحساب ديالك"):Acc.status==="checking"?"…":"ضيف")+'</h2><p class="muted">'+(signed?"داخل بالحساب ديالك فـ "+PLAT:"ماشي داخل بحساب")+'</p></div>'+(FB&&signed?'<button class="btn sm" data-act="signout" style="margin-inline-start:auto">خروج</button>':"")+'</div>'+
  '<div class="sync '+sy[0]+'"><i></i><span>'+sy[1]+'</span></div>'+
  (signed||Acc.status==="checking"?"":(FB?'<div class="card box"><h2>دخل بالحساب ديالك</h2><p class="note" style="margin-bottom:12px">دخل بحساب Google باش يتحفظ التقدّم ديالك وتبان فالترتيب مع صحابك.</p><button class="btn pri block" data-act="signin">الدخول بـ Google</button></div>'
  :'<div class="card box"><h2>كيفاش تدخل؟</h2><p class="note">حل هاد الصفحة وانت داخل بالحساب ديالك فـ claude.ai. من بعد، التقدّم ديالك غادي يتحفظ فالحساب ديالك وتلقاه فأي جهاز.</p></div>'))+
  '<div class="card box"><h2>التقدّم ديالي</h2><div class="acc-ls">'+langs+'</div></div>'+
  '<div class="card box"><h2>السمية فالترتيب</h2><form class="nick" id="nickf"><input id="nick" maxlength="16" value="'+esc(ST.nick||Acc.name||"")+'" placeholder="سميتك فالترتيب" aria-label="سميتك فالترتيب" autocomplete="nickname"><button class="btn pri" type="submit">سجّل</button></form><p class="note" style="margin-top:8px">هادي هي السمية الوحيدة اللي كيشوفوها صحابك.</p></div>'+
  '<div class="card box"><h2>كيفاش كيخدم الحساب</h2><ul class="howto"><li>'+ic("check")+'<span>كل واحد كيدخل بالحساب ديالو فـ '+PLAT+'، والتقدّم ديالو كيبقى بوحدو.</span></li><li>'+ic("check")+'<span>حتى واحد ما كيشوف الكلمات والنقط ديالك، غير السمية اللي سجّلتي فالترتيب.</span></li><li>'+ic("check")+'<span>'+(FB?"صيفط الرابط لصحابك، وكل واحد يدخل بحساب Google ديالو.":"باش يحفظو صحابك التقدّم ديالهم، عطيهم الرابط وصلاحية Contributor من Share.")+'</span></li></ul></div></div>';
}

/* ---------- GRAMMAR ---------- */
function vGrammar(){
 var p=P(),ls=LESSONS[U.lang];
 if(U.lesson!=null){var l=ls[U.lesson],done=!!p.lessons[U.lesson];
  return'<div class="lview"><button class="back" data-act="lessons">'+ic("right")+'كاع الدروس</button><span class="tag" style="align-self:flex-start">الدرس '+(U.lesson+1)+' من '+ls.length+'</span><h1>'+lessonWord(l.t.split(" — ")[0],"")+'<br><span class="muted" style="font-size:1.1rem;font-weight:600">'+esc(l.t.split(" — ")[1]||"")+'</span></h1><p class="d">'+esc(l.d)+'</p>'+
   '<div class="card ltable">'+l.r.map(function(r){return'<div><span class="r">'+lessonWord(r[0],r[2])+(r[2]?gtag({g:r[2]}):"")+'</span><span class="r"><span class="muted">'+esc(r[1])+'</span><button data-act="saytxt" data-t="'+esc(r[0])+'" aria-label="سمع">'+ic("spk")+'</button></span></div>'}).join("")+'</div>'+
   '<div class="qfoot">'+(U.lesson>0?'<button class="btn" data-act="lesson" data-i="'+(U.lesson-1)+'">السابق</button>':"")+'<button class="btn '+(done?"done":"pri")+'" data-act="lessondone"'+(done?" disabled":"")+'>'+(done?"فهمتو ✓":"فهمت  +20 XP")+'</button>'+(U.lesson<ls.length-1?'<button class="btn" data-act="lesson" data-i="'+(U.lesson+1)+'">التالي</button>':"")+'</div></div>';
 }
 return'<div class="view-head"><h1>القواعد</h1></div><p class="muted" style="margin:-6px 0 16px">دروس قصيرة على الأساسيات ديال '+LANG[U.lang].name+'.</p><div class="lessons">'+ls.map(function(l,i){var dn=!!p.lessons[i];
  return'<button class="card lesson'+(dn?" done":"")+'" data-act="lesson" data-i="'+i+'"><span class="n num">'+(dn?ic("check"):i+1)+'</span><span class="t"><b>'+lessonWord(l.t.split(" — ")[0],"")+'</b><small>'+esc(l.t.split(" — ")[1]||"")+'</small></span>'+ic("left")+'</button>'}).join("")+'</div>';
}

/* =========================================================
   7. EVENTS
   ========================================================= */
var ACT={
 pick:function(t){enterLang(t.dataset.lang)},
 switch:function(){showWelcome()},
 nav:function(t){go(t.dataset.v)},
 continue:function(){var p=P(),w=words(),i=-1;for(var k=0;k<w.length;k++)if(!p.learned[w[k].id]){i=k;break}
  if(i<0){U.qmode="a";go("quiz");return}U.cefr=ALL;U.cat=ALL;U.q="";U.wmode="cards";U.idx=i;U.flipped=false;go("words")},
 qgo:function(t){Q=null;U.qmode=t.dataset.m;go("quiz")},
 wmode:function(t){U.wmode=t.dataset.m;renderView()},
 cat:function(t){U.cat=t.dataset.c;U.idx=0;U.flipped=false;renderView()},
 clearq:function(){U.q="";U.idx=0;renderView()},
 flip:function(){U.flipped=!U.flipped;U.flipAnim=true;$("wbody").innerHTML=wBody();U.flipAnim=false},
 next:function(){var n=deck().length;U.idx=(U.idx+1)%n;U.flipped=false;rerenderWords()},
 prev:function(){var n=deck().length;U.idx=(U.idx-1+n)%n;U.flipped=false;rerenderWords()},
 say:function(){var e=deck()[U.idx];if(e)speak(e.w)},
 sayex:function(){var e=deck()[U.idx];if(e)speak(plainEx(e),.8)},
 sayid:function(t){var e=byId(t.dataset.id);if(e)speak(e.w)},
 saytxt:function(t){speak(t.dataset.t)},
 learn:function(){var e=deck()[U.idx];if(e&&learn(e.id)){toast("+10 XP");rerenderWords();refreshPills()}},
 open:function(t){var d=deck(),id=t.dataset.id;for(var i=0;i<d.length;i++)if(d[i].id===id){U.idx=i;break}U.wmode="cards";U.flipped=false;renderView();window.scrollTo(0,0)},
 qmode:function(t){U.qmode=t.dataset.m;renderView()},
 account:function(){go("account")},
 signin:function(){if(!window.LINGO_AUTH){toast("الدخول مازال ما مفعّلش: خاص صاحب الموقع يحط الإعدادات ديال Firebase فـ config.js");return}window.LINGO_AUTH.signIn().catch(function(e){toast(e&&e.code==="auth/unauthorized-domain"?"خاص تزيد هاد الدومين فـ Firebase (Authorized domains)":"ما تمّش الدخول، عاود جرّب")})},
 signout:function(){if(window.LINGO_AUTH)window.LINGO_AUTH.signOut()},
 cefr:function(t){U.cefr=t.dataset.l;U.cat=ALL;U.idx=0;U.flipped=false;renderView()},
 qcefr:function(t){U.qcefr=t.dataset.l;U.qcat=ALL;renderView()},
 golvl:function(t){U.cefr=t.dataset.l;U.cat=ALL;U.q="";U.wmode="cards";U.flipped=false;var p=P(),d=deck();U.idx=0;for(var i=0;i<d.length;i++)if(!p.learned[d[i].id]){U.idx=i;break}go("words")},
 qlvl:function(t){U.qlvl=t.dataset.l;renderView()},
 qstart:function(){startQuiz()},
 qopt:function(t){var it=Q.items[Q.i];if(it.given!=null)return;var k=+t.dataset.k,o=it.opts[k],key=Q.mode==="b"?"w":"da";grade(o[key]===it.e[key],it.e,k)},
 qcheck:function(){checkWrite(false)},
 qskip:function(){checkWrite(true)},
 qreplay:function(){speak(Q.items[Q.i].e.w)},
 qnext:function(){if(Q.i+1>=Q.items.length){finishQuiz();return}Q.i++;renderView();if(Q.mode==="c")setTimeout(function(){speak(Q.items[Q.i].e.w)},250)},
 qquit:function(){Q=null;renderView(true)},
 qagain:function(){var m=Q.mode;Q=null;startQuiz(m)},
 qhome:function(){Q=null;renderView(true)},
 calprev:function(){U.cal.m--;if(U.cal.m<0){U.cal.m=11;U.cal.y--}renderView()},
 calnext:function(){U.cal.m++;if(U.cal.m>11){U.cal.m=0;U.cal.y++}renderView()},
 resetask:function(){U.resetAsk=true;renderView()},
 resetno:function(){U.resetAsk=false;renderView()},
 resetyes:function(){ST[U.lang]=blank();U.resetAsk=false;Store.save();renderView();toast("تمسح التقدّم ديال "+LANG[U.lang].name)},
 lessons:function(){U.lesson=null;renderView(true)},
 lesson:function(t){U.lesson=+t.dataset.i;U.view="grammar";renderView(true);window.scrollTo(0,0)},
 lessondone:function(){var p=P();if(p.lessons[U.lesson])return;p.lessons[U.lesson]=1;addXP(20);Store.save();toast("+20 XP");renderView()}
};
document.addEventListener("click",function(ev){var t=ev.target.closest("[data-act]");if(!t||t.disabled)return;var f=ACT[t.dataset.act];if(f){ev.preventDefault();f(t,ev)}});
document.addEventListener("input",function(ev){if(ev.target.id==="q"){U.q=ev.target.value;U.idx=0;U.flipped=false;rerenderWords()}});
document.addEventListener("change",function(ev){if(ev.target.id==="qcat")U.qcat=ev.target.value});
document.addEventListener("submit",function(ev){
 if(ev.target.id!=="nickf")return;ev.preventDefault();
 var v=$("nick").value.trim().slice(0,16);if(!v){toast("كتب سميتك أولا");return}
 ST.nick=v;Store.save();Cloud.score();toast("تسجّلات سميتك: "+v);refreshAvatar();
});
document.addEventListener("keydown",function(ev){
 if(ev.target.id==="wans"&&ev.key==="Enter"){ev.preventDefault();if(Q&&Q.items[Q.i].given!=null)ACT.qnext();else checkWrite(false);return}
 if(U.view==="words"&&U.wmode==="cards"&&ev.target.tagName!=="INPUT"&&U.lang){
  if(ev.key==="ArrowLeft"){ACT.next()}else if(ev.key==="ArrowRight"){ACT.prev()}
 }
});

/* =========================================================
   8. BOOT
   ========================================================= */
Store.load();
showWelcome();
Cloud.init();
})();
</script>
