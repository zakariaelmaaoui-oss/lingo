function pad(n){return(n<10?"0":"")+n}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return dkey(new Date())}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function day(p,k){k=k||today();if(!p.days[k])p.days[k]={n:0,xp:0,q:0};return p.days[k]}
function dayN(p,k){return p.days[k]?p.days[k].n:0}

function streak(lang){
 var p=ST[lang],d=new Date(),cur=0;
 if(dayN(p,dkey(d))<GOAL)d=addDays(d,-1);
 while(dayN(p,dkey(d))>=GOAL){cur++;d=addDays(d,-1)}
 var keys=Object.keys(p.days).filter(function(k){return p.days[k].n>=GOAL}).sort(),best=0,run=0,prev=null;
 keys.forEach(function(k){var t=new Date(k+"T12:00:00");run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1;best=Math.max(best,run);prev=t});
 return{cur:cur,best:Math.max(best,cur),today:dayN(p,today())};
}
function level(xp){return{n:Math.floor(xp/XP_LEVEL)+1,into:xp%XP_LEVEL}}
function accuracy(p){var r=0,w=0;Object.keys(p.stats).forEach(function(k){r+=p.stats[k][0];w+=p.stats[k][1]});return r+w?Math.round(r/(r+w)*100):null}

function addXP(n){var p=P();p.xp+=n;day(p).xp+=n;bump("pxp")}
function learn(id){
 var p=P();if(p.learned[id])return false;
 p.learned[id]=Date.now();var d=day(p);d.n++;addXP(10);
 if(d.n===GOAL){var s=streak(U.lang);toast("برافو! كمّلتي هدف اليوم 🔥 "+s.cur+" "+(s.cur===1?"نهار":"يام")+" متتابعين",true);bump("pstreak")}
 Store.save();return true;
}

function weight(e){var p=P(),s=p.stats[e.id]||[0,0];if(!p.learned[e.id])return 3;if(s[1]>s[0])return 4;if(s[1]>0)return 2;return 1}

function startQuiz(mode){
 if(mode)U.qmode=mode;
 if(U.qmode==="c"&&!hasTTS){toast("الصوت ما خدامش فهاد المتصفح");return}
 var lv=LV[U.qlvl],all=words();
 /* Quizzes ask only about words already learned («حفظتها»); other words are used only as wrong options. */
 var known=P().learned,pool=all.filter(function(e){return known[e.id]&&(U.qcefr===ALL||e.lvl===U.qcefr)&&(U.qcat===ALL||e.cat===U.qcat)});
 if(!pool.length){toast("مازال ما حفظتي حتى كلمة هنا. سير للكلمات وحفظ شي وحدين أولا");return}
 if(U.qmode==="d")pool=pool.filter(writable);
 if(pool.length<2){toast("خاصك تحفظ على الأقل جوج كلمات هنا باش تدوز هاد الاختبار");return}
 var key=U.qmode==="b"?"w":"da";

  if(U.qmode==="d")return{e:e};
  var src=U.qlvl==="hard"?shuffle(all.filter(function(x){return x.cat===e.cat})).concat(shuffle(all)):shuffle(all);
  var seen={};seen[e[key]]=1;var dist=[];
  src.forEach(function(x){if(dist.length<lv.o-1&&!seen[x[key]]){seen[x[key]]=1;dist.push(x)}});
  return{e:e,opts:shuffle(dist.concat([e]))};

function norm(s,lvl){
 s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.…?!,¿¡]/g," ").replace(/\s+/g," ").trim();

 if(lvl==="easy")s=strip(s);
 return s;
}
function grade(ok,e,given){
 var it=Q.items[Q.i],p=P();it.given=given;it.ok=ok;
 var s=p.stats[e.id]||[0,0];s[ok?0:1]++;p.stats[e.id]=s;day(p).q++;
 it.gain=0;
 it.newM=false;if(ok){Q.score++;it.gain=LV[Q.lvl].xp+(Q.mode==="d"?4:0);Q.xp+=it.gain;addXP(it.gain);it.newM=master(e.id);if(learn(e.id))it.gain+=10}

}
function checkWrite(skip){

 if(m&&Q.lvl!=="hard")forms.push(e.w.slice(m[1].length));

}

/* ---------- EXAM ----------
   A real exam per level: 20 mixed questions, one timer for the whole exam, no feedback until the end.
   80% passes and gives a certificate. Results live in ST[lang].exams[level] = {best, tries, pass, last}. */
var EXAM={n:20,min:8,pass:80,xp:5,bonus:100};
/* Full review («المراجعة الشاملة»): questions on every learned word of every level, stored as exams.all (no certificate). */
var REVIEW={n:30,min:12,need:20};
function xName(l){return l==="all"?"المراجعة الشاملة":"امتحان "+l}
function xPool(l){return words().filter(function(e){return l==="all"||e.lvl===l})}
var XT={a:"المعنى",b:"الترجمة",g:"الجنس",f:"الجملة",d:"الكتابة",c:"الاستماع"};
var X=null,XTimer=null;
function xStop(){if(XTimer){clearInterval(XTimer);XTimer=null}}
function blankEx(e){var m=e.ex.match(/\*(.+?)\*/);return m?m[1]:null}
function baseWord(e){var m=e.g?e.w.match(LANG[U.lang].art):null;return m?e.w.slice(m[1].length):e.w}
function xOk(e,t){
 if(t==="g")return!!e.g;
 if(t==="f")return!!(e.g&&blankEx(e));
 if(t==="d")return writable(e);
 if(t==="c")return hasTTS;
 return true;
}
function xOpts(e,lvl,key,get){
 lvl=e.lvl;var all=words(),same=shuffle(all.filter(function(x){return x.lvl===lvl&&x.cat===e.cat})),lv=shuffle(all.filter(function(x){return x.lvl===lvl}));
 var ans=get(e),seen={},out=[];seen[ans]=1;
 same.concat(lv,shuffle(all)).forEach(function(x){var v=get(x);if(out.length<3&&v&&!seen[v]&&(key!=="f"||x.g)){seen[v]=1;out.push(v)}});
 return shuffle(out.concat([ans]));
}
function xBuild(lvl){
 var p=P(),pool=xPool(lvl);
 /* Exams ask only about words already learned (in this level, or in every level for the full review). */
 var picked=shuffle(pool.filter(function(e){return p.learned[e.id]})).slice(0,lvl==="all"?REVIEW.n:EXAM.n);
 /* Each question type appears about equally often, as far as each word allows. */
 var order=["d","f","g","c","b","a"],used={a:0,b:0,g:0,f:0,d:0,c:0};
 return shuffle(picked).map(function(e){
  var t=order.filter(function(k){return xOk(e,k)}).sort(function(x,y){return used[x]-used[y]})[0];used[t]++;
  var it={e:e,t:t};
  if(t==="a"||t==="c")it.opts=xOpts(e,lvl,"da",function(x){return x.da});
  else if(t==="b")it.opts=xOpts(e,lvl,"w",function(x){return x.w});
  else if(t==="f")it.opts=xOpts(e,lvl,"f",function(x){return x.g?blankEx(x):null});
  else if(t==="g")it.opts=LANG[U.lang].arts.map(function(a){return a[0]});
  return it;
 });
}
function xAnswer(it){
 var e=it.e;
 if(it.t==="a"||it.t==="c")return e.da;
 if(it.t==="b")return e.w;
 if(it.t==="f")return blankEx(e);
 if(it.t==="g")return e.g;
 return e.w;
}
function xLabel(it,v){
 if(it.t==="g"){var a=LANG[U.lang].arts.filter(function(x){return x[0]===v})[0];return a?a[1]+" · "+a[2]:v}
 return v;
}
function startExam(lvl){
 var all=lvl==="all",need=all?REVIEW.need:EXAM.n,mins=all?REVIEW.min:EXAM.min;
 var k=xPool(lvl).filter(function(e){return P().learned[e.id]}).length;
 if(k<need){toast("خاصك تحفظ "+(need-k)+" كلمة أخرى"+(all?"":" فـ "+lvl)+" باش يتحل هاد الامتحان");return}
 Q=null;xStop();
 X={lvl:lvl,items:xBuild(lvl),i:0,min:mins,end:Date.now()+mins*60000,done:false,startXP:P().xp};
 U.view="exam";renderView(true);window.scrollTo(0,0);
 XTimer=setInterval(xTick,500);xTick();
 xSpeakIfListen();
}
function xSpeakIfListen(){var it=X&&!X.done&&X.items[X.i];if(it&&it.t==="c")setTimeout(function(){speak(it.e.w)},300)}
function xLeft(){return Math.max(0,Math.ceil((X.end-Date.now())/1000))}
function fmtT(s){var m=Math.floor(s/60),r=s%60;return(m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function xTick(){
 if(!X||X.done){xStop();return}
 var s=xLeft(),el=$("xtime");
 if(el){el.textContent=fmtT(s);el.parentNode.classList.toggle("low",s<=60)}
 if(s<=0){toast("سالا الوقت ⏱");finishExam()}
}
function xRecord(v){
 var it=X.items[X.i];if(!it||it.given!=null)return;
 var ans=xAnswer(it);
 it.given=v;
 it.ok=it.t==="d"?(v!==""&&norm(v,"hard")===norm(ans,"hard")):v===ans;
 var p=P(),s=p.stats[it.e.id]||[0,0];s[it.ok?0:1]++;p.stats[it.e.id]=s;day(p).q++;
 if(it.ok)master(it.e.id);
 Store.save(true);
 if(X.i+1>=X.items.length){finishExam();return}
 X.i++;renderView();xSpeakIfListen();
}
function finishExam(){
 if(!X||X.done)return;
 xStop();X.done=true;
 X.items.forEach(function(it){if(it.given==null){it.given="";it.ok=false}});
 var p=P(),n=X.items.length,score=X.items.filter(function(it){return it.ok}).length,pc=Math.round(score/n*100);
 var r=p.exams[X.lvl]||{best:0,tries:0,pass:0,last:0},cert=X.lvl!=="all",first=cert&&pc>=EXAM.pass&&!r.pass;
 r.tries++;r.best=Math.max(r.best,pc);r.last=Date.now();if(first)r.pass=Date.now();
 p.exams[X.lvl]=r;
 X.score=score;X.pc=pc;X.first=first;X.time=Math.max(0,X.min*60-xLeft());
 addXP(score*EXAM.xp+(first?EXAM.bonus:0));
 Store.save();renderView(true);window.scrollTo(0,0);
}

   :'<button class="btn '+(ok?"":"pri")+' block" data-act="xstart" data-l="'+l+'">'+(ok?"عاود الامتحان":r.tries?"عاود جرّب":"ابدا الامتحان")+'</button>')+'</div>';
 }).join("");

  '<li><b class="num">'+EXAM.min+'</b> دقايق للامتحان كامل</li><li>ما كاينش التصحيح حتى للآخر، وما تقدرش ترجع للسؤال اللي فات</li>'+
  '<li>فالكتابة خاص الأداة والأكسان يكونو صحاح</li><li>خاصك <b class="num">'+EXAM.pass+'%</b> باش تنجح وتاخد الشهادة (+'+EXAM.bonus+' XP)</li></ul>'+
  '<p class="muted xnote">الأسئلة كتجي غير من الكلمات اللي حفظتي فهاد المستوى، ولهذا خاصك تحفظ على الأقل '+EXAM.n+' كلمة باش يتحل الامتحان.</p></div></div>'+

/* Daily lessons: DAILY[lang] new lessons a day, in the order lorder() gives.
   A lesson opens once the one before it (in that order) is done, while fewer than DAILY[lang] lessons were done today.
   p.lessons[i] holds the time it was marked done (1 = done before dates were kept). Indexes never change. */
var DAILY={fr:3};
/* French order: the 6 basics, then the pronunciation lessons (stored at 54-61), then the rest. */
var FR_ORDER=(function(){var o=[0,1,2,3,4,5],k;for(k=54;k<62;k++)o.push(k);for(k=6;k<54;k++)o.push(k);for(k=62;k<LESSONS.fr.length;k++)o.push(k);return o})();
function lorder(){return U.lang==="fr"?FR_ORDER:LESSONS[U.lang].map(function(_,i){return i})}
function doneToday(){var p=P(),t=today(),n=0;Object.keys(p.lessons).forEach(function(k){var v=p.lessons[k];if(v>1&&dkey(new Date(v))===t)n++});return n}
function lessonOpen(i){
 if(!DAILY[U.lang])return true;
 var p=P();if(p.lessons[i])return true;
 var o=lorder(),pos=o.indexOf(i);if(pos<=0)return true;
 return !!p.lessons[o[pos-1]]&&doneToday()<DAILY[U.lang];
}
function nextLesson(){var p=P(),o=lorder();for(var k=0;k<o.length;k++)if(!p.lessons[o[k]])return o[k];return -1}
function todayLessonCard(n){
 var l=LESSONS[U.lang][n],op=lessonOpen(n),d=doneToday(),max=DAILY[U.lang];
 if(!op)return'<div class="card tday wait"><span class="tile-ic ic-g">'+ic("check")+'</span><div><h3>كمّلتي دروس اليوم ✓</h3><p class="muted">الدرس الجاي: <span class="fw">'+esc(l.t.split(" — ")[0])+'</span>، كيتحل غدا.</p></div></div>';
 return'<button class="card tday" data-act="lesson" data-i="'+n+'"><span class="tile-ic ic-o">'+ic("layers")+'</span><div><span class="tag lv">'+(l.lvl||"A1")+' · دروس اليوم <span class="num">'+Math.min(d,max)+' / '+max+'</span></span><h3>الدرس الجاي: <span class="fw">'+esc(l.t.split(" — ")[0])+'</span></h3><p class="muted">'+esc(l.t.split(" — ")[1]||"")+'</p></div>'+ic("left")+'</button>';
}

 PR[k]={st:"loading"};renderView();
 window.LINGO_AUTH.token().then(function(tok){
  return fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(tok||"")},body:JSON.stringify({mode:"practice",lang:lang,level:l.lvl||"A1",lesson:{t:l.t,d:l.d+(l.tip?" "+l.tip:"")}})});
 }).then(function(r){return r.json().catch(function(){return{error:"bad"}}).then(function(d){if(!r.ok||d.error)throw new Error(d.error||"bad");return d})})
 .then(function(d){PR[k]={st:"ready",qs:d.questions,ans:{}}})
 .catch(function(e){PR[k]={st:"error",msg:chatErr(e&&e.message)}})
 .then(function(){if(U.view==="grammar"&&U.lesson===i&&U.lang===lang)renderView()});
}

/* =========================================================
   7. EVENTS
   ========================================================= */
var ACT={
 pick:function(t){enterLang(t.dataset.lang)},
 switch:function(){showWelcome()},
 nav:function(t){go(t.dataset.v)},
 continue:function(){var p=P(),w=words(),i=-1;for(var k=0;k<w.length;k++)if(!p.learned[w[k].id]){i=k;break}
  if(i<0){U.qmode="a";go("quiz");return}U.cefr=ALL;U.cat=ALL;U.q="";U.wmode="cards";U.pin=null;U.idx=0;U.flipped=false;go("words")},
 qgo:function(t){Q=null;U.qmode=t.dataset.m;go("quiz")},
 wmode:function(t){U.wmode=t.dataset.m;renderView()},
 cat:function(t){U.cat=t.dataset.c;U.pin=null;U.idx=0;U.flipped=false;renderView()},
 clearq:function(){U.q="";U.pin=null;U.idx=0;renderView()},
 flip:function(){U.flipped=!U.flipped;U.flipAnim=true;$("wbody").innerHTML=wBody();U.flipAnim=false},
 next:function(){step(1)},
 prev:function(){step(-1)},
 say:function(){var e=deck()[U.idx];if(e)speak(e.w)},
 sayex:function(){var e=deck()[U.idx];if(e)speak(plainEx(e),.8)},
 sayid:function(t){var e=byId(t.dataset.id);if(e)speak(e.w)},
 saytxt:function(t){speak(t.dataset.t)},
 learn:function(){var e=deck()[U.idx];if(e&&learn(e.id)){toast("+10 XP");rerenderWords();refreshPills()}},
 open:function(t){var id=t.dataset.id;U.wmode="cards";U.pin=id;var d=deck();U.idx=0;for(var i=0;i<d.length;i++)if(d[i].id===id){U.idx=i;break}U.flipped=false;renderView();window.scrollTo(0,0)},
 qmode:function(t){U.qmode=t.dataset.m;renderView()},
 account:function(){go("account")},
 signin:function(){if(!window.LINGO_AUTH){toast("الدخول مازال ما مفعّلش: خاص صاحب الموقع يحط الإعدادات ديال Firebase فـ config.js");return}window.LINGO_AUTH.signIn().catch(function(e){toast(e&&e.code==="auth/unauthorized-domain"?"خاص تزيد هاد الدومين فـ Firebase (Authorized domains)":"ما تمّش الدخول، عاود جرّب")})},
 signout:function(){if(window.LINGO_AUTH)window.LINGO_AUTH.signOut()},
 cefr:function(t){U.cefr=t.dataset.l;U.cat=ALL;U.pin=null;U.idx=0;U.flipped=false;renderView()},
 qcefr:function(t){U.qcefr=t.dataset.l;U.qcat=ALL;renderView()},
 golvl:function(t){U.cefr=t.dataset.l;U.cat=ALL;U.q="";U.wmode="cards";U.pin=null;U.flipped=false;U.idx=0;go("words")},
 qlvl:function(t){U.qlvl=t.dataset.l;renderView()},
 qstart:function(){startQuiz()},
 qopt:function(t){var it=Q.items[Q.i];if(it.given!=null)return;var k=+t.dataset.k,o=it.opts[k],key=Q.mode==="b"?"w":"da";grade(o[key]===it.e[key],it.e,k)},
 qcheck:function(){checkWrite(false)},
 qskip:function(){checkWrite(true)},
 qreplay:function(){speak(Q.items[Q.i].e.w)},
 qnext:function(){if(Q.i+1>=Q.items.length){finishQuiz();return}Q.i++;renderView();if(Q.mode==="c")setTimeout(function(){speak(Q.items[Q.i].e.w)},250)},
 qquit:function(){Q=null;renderView(true)},
 qagain:function(){var m=Q.mode;Q=null;startQuiz(m)},
 qhome:function(){Q=null;renderView(true)},
 calprev:function(){U.cal.m--;if(U.cal.m<0){U.cal.m=11;U.cal.y--}renderView()},
 calnext:function(){U.cal.m++;if(U.cal.m>11){U.cal.m=0;U.cal.y++}renderView()},
 resetask:function(){U.resetAsk=true;renderView()},
 resetno:function(){U.resetAsk=false;renderView()},
 resetyes:function(){ST[U.lang]=blank();U.resetAsk=false;Store.save();renderView();toast("تمسح التقدّم ديال "+LANG[U.lang].name)},
 xstart:function(t){startExam(t.dataset.l)},
 xopt:function(t){var it=X&&X.items[X.i];if(!it||it.given!=null||X.busy)return;X.busy=true;t.classList.add("pick");setTimeout(function(){if(X)X.busy=false;if(X&&!X.done&&X.items[X.i]===it)xRecord(it.opts[+t.dataset.k])},180)},
 xnext:function(){var i=$("xans"),v=i?i.value.trim():"";if(!v){toast("كتب شي جواب ولا اضغط «ما عرفتش»");return}xRecord(v)},
 xskip:function(){xRecord("")},
 xreplay:function(){if(X)speak(X.items[X.i].e.w)},
 xquit:function(){xStop();X=null;toast("تلغى الامتحان، ما تحسبش هاد المحاولة");renderView(true)},
 xhome:function(){X=null;renderView(true)},
 xagain:function(){startExam(X.lvl)},
 chatnew:function(){try{localStorage.removeItem(chatKey(U.lang))}catch(e){}Chat.open={};renderView()},
 chatlvl:function(t){Chat.lvl[U.lang]=t.dataset.l;renderView()},
 chattr:function(t){var i=+t.dataset.i;Chat.open[i]=!Chat.open[i];renderView()},
 lessons:function(){U.lesson=null;renderView(true)},
 lesson:function(t){var i=+t.dataset.i;if(!lessonOpen(i)){toast("هاد الدرس كيتحل من بعد. كمّل الدروس اللي قبلو");return}U.lesson=i;U.view="grammar";renderView(true);window.scrollTo(0,0)},
 lessondone:function(){var p=P();if(p.lessons[U.lesson])return;p.lessons[U.lesson]=Date.now();addXP(20);Store.save();toast("+20 XP");renderView()},
 pracgo:function(){practiceLoad()},
 pracans:function(t){var s=PR[U.lang+":"+U.lesson];if(!s||s.st!=="ready")return;var n=+t.dataset.n,k=+t.dataset.k;if(s.ans[n]!=null)return;s.ans[n]=k;
  if(k===s.qs[n].answer){addXP(3);Store.save();refreshPills()}renderView()}
};
document.addEventListener("click",function(ev){var t=ev.target.closest("[data-act]");if(!t||t.disabled)return;var f=ACT[t.dataset.act];if(f){ev.preventDefault();f(t,ev)}});
document.addEventListener("input",function(ev){if(ev.target.id==="q"){U.q=ev.target.value;U.pin=null;U.idx=0;U.flipped=false;rerenderWords()}});
document.addEventListener("change",function(ev){if(ev.target.id==="qcat")U.qcat=ev.target.value});
document.addEventListener("submit",function(ev){
 if(ev.target.id==="chatf"){ev.preventDefault();var i=$("chatmsg");if(i)chatSend(i.value);return}
 if(ev.target.id!=="nickf")return;ev.preventDefault();
 var v=$("nick").value.trim().slice(0,16);if(!v){toast("كتب سميتك أولا");return}
 ST.nick=v;Store.save();Cloud.score();toast("تسجّلات سميتك: "+v);refreshAvatar();
});
document.addEventListener("keydown",function(ev){
 if(ev.target.id==="xans"&&ev.key==="Enter"){ev.preventDefault();ACT.xnext();return}
 if(ev.target.id==="wans"&&ev.key==="Enter"){ev.preventDefault();if(Q&&Q.items[Q.i].given!=null)ACT.qnext();else checkWrite(false);return}
 if(U.view==="words"&&U.wmode==="cards"&&ev.target.tagName!=="INPUT"&&U.lang){
  if(ev.key==="ArrowLeft"){ACT.next()}else if(ev.key==="ArrowRight"){ACT.prev()}
 }
});

/* =========================================================
   8. BOOT
   ========================================================= */
Store.load();
showWelcome();
Cloud.init();
})();
</script>
